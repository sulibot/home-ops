apiVersion: v1
kind: Pod
metadata:
  name: zeropod-tcp-client
  namespace: zeropod-experiment
  labels:
    app.kubernetes.io/name: zeropod-tcp-client
spec:
  nodeSelector:
    kubernetes.io/hostname: solwk01
  automountServiceAccountToken: false
  restartPolicy: Never
  containers:
    - name: client
      image: zot.sulibot.com/experiments/criu@sha256:e541435075d9de5154df4f327efd508cd33fb1c4f1a301064e994edbc76c0fd3
      imagePullPolicy: IfNotPresent
      command: [python3, -c, "import time; time.sleep(86400)"]
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
      securityContext:
        privileged: false
      volumeMounts:
        - name: client-script
          mountPath: /opt/criu-demo/test_cycle.py
          subPath: test_cycle.py
          readOnly: true
  volumes:
    - name: client-script
      configMap:
        name: zeropod-client-script
