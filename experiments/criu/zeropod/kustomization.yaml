apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: zeropod-experiment
resources:
  - namespace.yaml
  - workload-pod.yaml
  - client-pod.yaml
configMapGenerator:
  - name: zeropod-workload-script
    files:
      - workload.py
  - name: zeropod-client-script
    files:
      - test_cycle.py
