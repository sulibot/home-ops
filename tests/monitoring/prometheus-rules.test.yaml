  - series: kube_job_status_failed{namespace="batch",job_name="new-failure-123"}
    values: 1+0x5
  - series: kube_job_owner{namespace="batch",job_name="new-failure-123",owner_kind="CronJob",owner_name="new-failure"}
    values: 1+0x5
  - series: kube_cronjob_status_last_successful_time{namespace="batch",cronjob="new-failure"}
    values: 200+0x5
  promql_expr_test:
  - expr: count(ALERTS{alertname="KubeJobFailed",alertstate="firing"}) or vector(0)
    eval_time: 3m
    exp_samples:
    - labels: '{}'
