rule_files:
- rules.yaml
evaluation_interval: 1m
group_eval_order:
- kubernetes.jobs
tests:
- name: recovered
  interval: 1m
  input_series:
  - series: kube_job_status_start_time{namespace="batch",job_name="recovered-123"}
    values: 100+0x5
  - series: kube_job_failed{namespace="batch",job_name="recovered-123",condition="true"}
    values: 1+0x5
  - series: kube_job_status_failed{namespace="batch",job_name="recovered-123"}
    values: 1+0x5
  - series: kube_job_owner{namespace="batch",job_name="recovered-123",owner_kind="CronJob",owner_name="recovered"}
    values: 1+0x5
  - series: kube_cronjob_status_last_successful_time{namespace="batch",cronjob="recovered"}
    values: 200+0x5
  promql_expr_test:
  - expr: count(ALERTS{alertname="KubeJobFailed",alertstate="firing"}) or vector(0)
    eval_time: 3m
    exp_samples:
    - labels: '{}'
      value: 0
- name: new-failure
  interval: 1m
  input_series:
  - series: kube_job_status_start_time{namespace="batch",job_name="new-failure-123"}
    values: 300+0x5
  - series: kube_job_failed{namespace="batch",job_name="new-failure-123",condition="true"}
