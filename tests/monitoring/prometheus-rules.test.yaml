- name: staging-healthy
  interval: 1m
  input_series:
  - series: kube_statefulset_replicas{namespace="engineering-staging",statefulset="context-fabric-supabase-db"}
    values: 1+0x20
  - series: kube_cronjob_status_last_successful_time{namespace="engineering-staging",cronjob="context-fabric-snapshot"}
    values: 1+0x20
  promql_expr_test:
  - expr: count(ALERTS{alertname="EngineeringStagingPostgresMissing",alertstate="firing"})
      or vector(0)
