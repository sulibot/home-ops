apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: zeropod-node
  namespace: zeropod-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: zeropod-node
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zeropod-node
    spec:
      serviceAccountName: zeropod-node
      nodeSelector:
        kubernetes.io/hostname: solwk03
      initContainers:
        - name: bootstrap
          image: zot.sulibot.com/infra/zeropod-talos@sha256:428af80e10a358ed9237f5964a0d236a005d21d08f62ff06722bb9c183fb7b48
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: zeropod-var
              mountPath: /host
        - name: prepare-bpf-fs
          image: alpine:3.21@sha256:3c81aa9a3d770b316568f4499e30461a5cd3fbd7180bd89e28e34894c7845832
          command: [/bin/sh, -c]
          args:
            - mount | grep '/sys/fs/bpf type bpf' || mount -t bpf bpf /sys/fs/bpf
          securityContext:
            privileged: true
          volumeMounts:
            - name: bpf
              mountPath: /sys/fs/bpf
              mountPropagation: Bidirectional
      containers:
        - name: manager
          image: ghcr.io/ctrox/zeropod-manager:v0.13.0@sha256:13979ce88174fe6b80f6ff4d644339006ede4c67907dc974cff22a52c515da7b
          command: [/zeropod-manager]
          args:
            - -metrics-addr=:8080
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 512Mi
          ports:
            - name: metrics
              containerPort: 8080
            - name: node-server
              containerPort: 8090
          livenessProbe:
            httpGet:
              path: /probe
              port: metrics
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /probe
              port: metrics
            periodSeconds: 5
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            appArmorProfile:
              type: Unconfined
            capabilities:
              add: [SYS_PTRACE, SYS_ADMIN, NET_ADMIN, SYS_RESOURCE]
          volumeMounts:
            - name: zeropod-run
              mountPath: /run/zeropod
            - name: zeropod-var
              mountPath: /var/lib/zeropod
            - name: zeropod-var
              mountPath: /opt/zeropod
            - name: hostproc
              mountPath: /hostproc
            - name: bpf
              mountPath: /sys/fs/bpf
            - name: tls
              mountPath: /tls
              readOnly: true
      tolerations:
        - operator: Exists
      volumes:
        - name: zeropod-var
          hostPath:
            path: /var/lib/zeropod
            type: DirectoryOrCreate
        - name: zeropod-run
          hostPath:
            path: /run/zeropod
            type: DirectoryOrCreate
        - name: hostproc
          hostPath:
            path: /proc
            type: Directory
        - name: bpf
          hostPath:
            path: /sys/fs/bpf
            type: Directory
        - name: tls
          secret:
            secretName: ca-cert
            items:
              - key: tls.crt
                path: ca.crt
              - key: tls.key
                path: ca.key
