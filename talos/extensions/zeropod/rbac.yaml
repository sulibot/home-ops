apiVersion: v1
kind: ServiceAccount
metadata:
  name: zeropod-node
  namespace: zeropod-system
---
# The upstream manager caches Pods and Nodes and unconditionally starts its
# Migration controller. Pilot RBAC excludes Pod deletion and node migration.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: zeropod:canary-manager
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
  - apiGroups: [runtime.zeropod.ctrox.dev]
    resources: [migrations]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: zeropod:canary-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: zeropod:canary-manager
subjects:
  - kind: ServiceAccount
    name: zeropod-node
    namespace: zeropod-system
