---
# ============================================================================
# Proxmox Host Network Configuration and Kernel Tuning
# ============================================================================

## Deploy /etc/network/interfaces.d/dummy_underlay from template
#- name: Deploy /etc/network/interfaces.d/dummy_underlay
#  ansible.builtin.template:
#    src: interfaces.dummy_underlay.pve.j2
#    dest: /etc/network/interfaces.d/dummy_underlay
#    mode: '0644'
#  notify: Reload network

# Deploy /etc/network/interfaces from template
- name: Deploy /etc/network/interfaces
  ansible.builtin.template:
    src: interfaces.pve.j2
    dest: /etc/network/interfaces
    mode: '0644'
  notify: Reload network

# Ensure /etc/sysctl.d directory exists for custom sysctl files
- name: Ensure /etc/sysctl.d exists
  ansible.builtin.file:
    path: /etc/sysctl.d
    state: directory
    mode: '0755'

# ENG-322 cleanup: proxy_ndp=0 was in this file's loop at some earlier
# point in this role's history and got trimmed out, but the stale key was
# never removed from the file itself (ansible.posix.sysctl with
# state: present only adds/updates keys it's told about, never prunes
# ones that fall out of the loop). This directly conflicts with the
# correct proxy_ndp=1 the sysctl role sets in 99-custom-pve.conf - since
# sysctl.d applies files in alphabetical order, 99-forwarding.conf (f)
# would win over 99-custom-pve.conf (c) on any full `sysctl --system`
# reload (e.g. every reboot), silently breaking VIP/anycast-gateway NDP
# resolution again. Found live via a full ansible-vs-running audit; the
# live runtime value was already correct (1, from a prior direct sysctl
# -w) but would NOT have survived a reboot without this.
- name: Remove stale conflicting proxy_ndp entries from 99-forwarding.conf
  ansible.posix.sysctl:
    name: "{{ item }}"
    sysctl_file: /etc/sysctl.d/99-forwarding.conf
    state: absent
    reload: yes
  loop:
    - net/ipv6/conf/all/proxy_ndp
    - net/ipv6/conf/default/proxy_ndp

# Task: Configure global IP forwarding and general network sanity settings
- name: Configure global IP forwarding and general network sanity
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-forwarding.conf
    state: present
    reload: yes
  loop:
    # --- IP Forwarding ---
    - { name: 'net/ipv4/ip_forward',                 value: '1' }
    - { name: 'net/ipv6/conf/all/forwarding',        value: '1' }
    - { name: 'net/ipv6/conf/default/forwarding',    value: '1' }

    # --- Reverse Path Filtering (IPv4) ---
    # Disable globally for EVPN/VRF asymmetric return paths.
    - { name: 'net/ipv4/conf/all/rp_filter',         value: '0' }
    - { name: 'net/ipv4/conf/default/rp_filter',     value: '0' }

    # --- ICMP Redirects (v4/v6) ---
    - { name: 'net/ipv4/conf/all/accept_redirects',     value: '0' }
    - { name: 'net/ipv4/conf/default/accept_redirects', value: '0' }
    - { name: 'net/ipv4/conf/all/send_redirects',       value: '0' }
    - { name: 'net/ipv4/conf/default/send_redirects',   value: '0' }
    - { name: 'net/ipv6/conf/all/accept_redirects',     value: '0' }
    - { name: 'net/ipv6/conf/default/accept_redirects', value: '0' }

# ============================================================================
# xvrf Cross-Connect Configuration
# ============================================================================
# Creates IPv6 /127 point-to-point link between default VRF and vrf_evpnz1
# Enables BGP "import vrf default" routes to have resolvable nexthops
# ============================================================================

# ============================================================================
# xvrf Cross-Connect Configuration
# ============================================================================
# Creates IPv6 /127 point-to-point link between default VRF and vrf_evpnz1
# Enables BGP "import vrf default" routes to have resolvable nexthops
# ============================================================================

- name: Deploy xvrf cross-connect network configuration
  ansible.builtin.template:
    src: xvrf_ips.j2
    dest: /etc/network/interfaces.d/xvrf-ips
    mode: '0644'
  notify: Reload network
  when: inventory_hostname in ['pve01','pve02','pve03']

# ============================================================================
# SDN Anycast Link-Local Address Configuration
# ============================================================================
# Configures static link-local IPv6 addresses (fe80::<vnet_id>:fffe) on all
# VNet bridges to enable BGP unnumbered peering with consistent addresses
# across all PVE nodes for seamless VM migration
# ============================================================================

- name: Deploy SDN anycast link-local address configuration
  ansible.builtin.template:
    src: sdn_anycast_lla.j2
    dest: /etc/network/interfaces.d/sdn-anycast-lla
    mode: '0644'
  notify: Reload network
  when: inventory_hostname in ['pve01','pve02','pve03']

# ============================================================================
# EVPN fabric rp_filter fix (ENG-328)
# ============================================================================
# Proxmox's SDN code sets rp_filter=2 on each dynamically-created EVPN
# fabric interface (vrfbr_*, vrfvx_*) at creation time, silently
# overriding the rp_filter=0 default set above - and even loose (2) drops
# legitimate asymmetric EVPN traffic arriving via the fabric. Deliberately
# scoped to the fabric interfaces only, not vnetNNN (the VM-facing VNet
# interfaces) - rp_filter is an ingress check, the affected traffic
# arrives on the fabric side, and Proxmox's own anti-spoofing default on
# the VM-facing side is real protection this fix doesn't need to remove.
# A one-time sysctl isn't durable since SDN reloads recreate these
# interfaces; a udev rule re-applies it every time. See
# docs/tickets/eng-322-vrf-evpnz1-ipv4-snat.md.
# ============================================================================

- name: Deploy udev rule to disable rp_filter on EVPN fabric interfaces
  ansible.builtin.template:
    src: 90-evpn-rpfilter.rules.j2
    dest: /etc/udev/rules.d/90-evpn-rpfilter.rules
    mode: '0644'
  register: evpn_rpfilter_udev
  when: inventory_hostname in ['pve01','pve02','pve03']

- name: Reload udev rules
  ansible.builtin.command: udevadm control --reload-rules
  when: evpn_rpfilter_udev is changed

- name: Apply rp_filter=0 immediately to existing EVPN fabric interfaces
  ansible.builtin.shell: |
    set -e
    for iface in $(ls /sys/class/net | grep -E '^(vrfbr_|vrfvx_)'); do
      sysctl -w net.ipv4.conf.${iface}.rp_filter=0
    done
  changed_when: false
  when: inventory_hostname in ['pve01','pve02','pve03']

# The SDN interfaces and xvrf pair are created asynchronously during boot.
# Their interface post-up/udev hooks can race Proxmox's own sysctl writes, and
# pve-guests may otherwise start before the EVPN forwarding invariants exist.
- name: Deploy EVPN runtime guard
  ansible.builtin.template:
    src: evpn-runtime-guard.j2
    dest: /usr/local/sbin/evpn-runtime-guard
    mode: '0755'
  when: inventory_hostname in ['pve01','pve02','pve03']
  tags: [evpn_runtime_guard]

- name: Deploy EVPN runtime guard service
  ansible.builtin.template:
    src: evpn-runtime-guard.service.j2
    dest: /etc/systemd/system/evpn-runtime-guard.service
    mode: '0644'
  register: evpn_runtime_guard_service
  when: inventory_hostname in ['pve01','pve02','pve03']
  tags: [evpn_runtime_guard]

- name: Deploy EVPN runtime guard timer
  ansible.builtin.template:
    src: evpn-runtime-guard.timer.j2
    dest: /etc/systemd/system/evpn-runtime-guard.timer
    mode: '0644'
  register: evpn_runtime_guard_timer
  when: inventory_hostname in ['pve01','pve02','pve03']
  tags: [evpn_runtime_guard]

- name: Reload systemd for EVPN runtime guard
  ansible.builtin.systemd_service:
    daemon_reload: true
  when:
    - inventory_hostname in ['pve01','pve02','pve03']
    - evpn_runtime_guard_service is changed or evpn_runtime_guard_timer is changed
  tags: [evpn_runtime_guard]

- name: Enable EVPN runtime guard at boot
  ansible.builtin.systemd_service:
    name: evpn-runtime-guard.service
    enabled: true
  when:
    - inventory_hostname in ['pve01','pve02','pve03']
    - not ansible_check_mode
  tags: [evpn_runtime_guard]

- name: Enable EVPN runtime guard timer
  ansible.builtin.systemd_service:
    name: evpn-runtime-guard.timer
    enabled: true
    state: started
  when:
    - inventory_hostname in ['pve01','pve02','pve03']
    - not ansible_check_mode
  tags: [evpn_runtime_guard]

- name: Reconcile EVPN runtime invariants now
  ansible.builtin.systemd_service:
    name: evpn-runtime-guard.service
    state: started
  changed_when: false
  when:
    - inventory_hostname in ['pve01','pve02','pve03']
    - not ansible_check_mode
  tags: [evpn_runtime_guard]
