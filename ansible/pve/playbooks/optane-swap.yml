---
# ENG-364: add a dedicated swap partition on the Optane device's confirmed
# free space, scoped to pve01/pve02 only - pve03's Optane module is much
# smaller and already fully allocated. See roles/optane_swap/tasks/main.yml
# for the full rationale (why Optane, why not swap-on-ZFS).
- name: Add Optane-backed swap
  hosts: pve01,pve02
  become: true
  serial: 1

  roles:
    - optane_swap
