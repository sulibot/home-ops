---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: synch
  namespace: flux-system
  labels:
    layer: applications
    component: application
    critical: "false"
spec:
  interval: 15m
  retryInterval: 30s
  path: ./kubernetes/apps/tier-2-applications/synch/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  wait: true
  timeout: 5m
