version: 1
metadata:
  name: Proxy Providers
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  # Service account for the self-managed proxy outpost deployment
  - model: authentik_core.user
    state: present
    identifiers:
      username: outpost-svc
    attrs:
      username: outpost-svc
      name: Proxy Outpost Service Account
      type: service_account
      path: goauthentik.io/serviceaccounts
  # API token — key injected from 1Password so outpost deployment can reference it
  - model: authentik_core.token
    state: present
    identifiers:
      identifier: outpost-api-token
    attrs:
      user: !Find [authentik_core.user, [username, outpost-svc]]
      intent: api
      expiring: false
      key: !Env OUTPOST_TOKEN
  # Firefly — full proxy mode, injects X-Authentik-Email for remote_user_guard
  # Firefly — full proxy mode, injects X-Authentik-Email for remote_user_guard
  - model: authentik_providers_proxy.proxyprovider
    state: present
    identifiers:
      name: firefly-proxy
    attrs:
      name: firefly-proxy
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: proxy
      external_host: "https://firefly.sulibot.com"
      internal_host: "http://firefly.default.svc.cluster.local:8080"
      internal_host_ssl_validation: false
  - model: authentik_core.application
    state: present
    identifiers:
      slug: firefly
    attrs:
      name: Firefly
      slug: firefly
      provider: !Find [authentik_providers_proxy.proxyprovider, [name, firefly-proxy]]
      meta_launch_url: "https://firefly.sulibot.com"
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, policy-access-trusted]]
      target: !Find [authentik_core.application, [slug, firefly]]
      order: 0
    attrs:
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, policy-access-trusted]]
      target: !Find [authentik_core.application, [slug, firefly]]
      order: 0
      enabled: true
      negate: false
      timeout: 30
  - model: authentik_core.group
    state: present
    identifiers:
      name: grimmory-admins
    attrs:
      name: grimmory-admins
  - model: authentik_providers_proxy.proxyprovider
    state: present
    identifiers:
      name: grimmory-proxy
    attrs:
      name: grimmory-proxy
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: proxy
      external_host: "https://grimmory.sulibot.com"
      internal_host: "http://grimmory.default.svc.cluster.local"
      internal_host_ssl_validation: false
  - model: authentik_core.application
    state: present
    identifiers:
      slug: grimmory
    attrs:
      name: Grimmory
      slug: grimmory
      provider: !Find [authentik_providers_proxy.proxyprovider, [name, grimmory-proxy]]
      meta_launch_url: "https://grimmory.sulibot.com"
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, policy-access-standard]]
      target: !Find [authentik_core.application, [slug, grimmory]]
      order: 0
    attrs:
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, policy-access-standard]]
      target: !Find [authentik_core.application, [slug, grimmory]]
      order: 0
      enabled: true
      negate: false
      timeout: 30
  - model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: digarr
    attrs:
      name: digarr
      client_id: !Env DIGARR_OIDC_CLIENT_ID
      client_secret: !Env DIGARR_OIDC_CLIENT_SECRET
      redirect_uris:
        - url: "https://digarr.sulibot.com/api/v1/auth/oidc/callback"
          matching_mode: strict
      authentication_flow: !Find [authentik_flows.flow, [slug, sulibot-internal-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      issuer_mode: per_provider
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
  - model: authentik_core.application
    state: present
    identifiers:
      slug: digarr
    attrs:
      name: Digarr
      slug: digarr
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, digarr]]
      meta_launch_url: "https://digarr.sulibot.com"
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, policy-access-standard]]
      target: !Find [authentik_core.application, [slug, digarr]]
      order: 0
    attrs:
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, policy-access-standard]]
      target: !Find [authentik_core.application, [slug, digarr]]
      order: 0
      enabled: true
      negate: false
      timeout: 30
  - model: authentik_providers_proxy.proxyprovider
    state: present
    identifiers:
      name: aurral-proxy
    attrs:
      name: aurral-proxy
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      mode: proxy
      external_host: "https://aurral.sulibot.com"
      internal_host: "http://aurral.default.svc.cluster.local:3001"
      internal_host_ssl_validation: false
  - model: authentik_core.application
    state: present
    identifiers:
      slug: aurral
    attrs:
      name: Aurral
      slug: aurral
      provider: !Find [authentik_providers_proxy.proxyprovider, [name, aurral-proxy]]
      meta_launch_url: "https://aurral.sulibot.com"
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, policy-access-standard]]
      target: !Find [authentik_core.application, [slug, aurral]]
      order: 0
    attrs:
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, policy-access-standard]]
      target: !Find [authentik_core.application, [slug, aurral]]
      order: 0
      enabled: true
      negate: false
      timeout: 30
  # Home Assistant app — OIDC client for native app token exchange
  - model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: home-assistant-app
    attrs:
      name: home-assistant-app
      client_type: public
      client_id: homeassistant-app
      redirect_uris:
        - url: "https://hass.sulibot.com/auth/oidc/callback"
          matching_mode: strict
        - url: "https://hass-app.sulibot.com/auth/oidc/callback"
          matching_mode: strict
        - url: "https://hass-local.sulibot.com/auth/oidc/callback"
          matching_mode: strict
        - url: "https://hass-get-token.sulibot.com/auth/oidc/callback"
          matching_mode: strict
      authentication_flow: !Find [authentik_flows.flow, [slug, sulibot-internal-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      issuer_mode: per_provider
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
  - model: authentik_core.application
    state: present
    identifiers:
      slug: home-assistant-app
    attrs:
      name: Home Assistant App
      slug: home-assistant-app
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, home-assistant-app]]
      meta_launch_url: "https://hass-get-token.sulibot.com/auth/oidc/welcome"
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, policy-access-standard]]
      target: !Find [authentik_core.application, [slug, home-assistant-app]]
      order: 0
    attrs:
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, policy-access-standard]]
      target: !Find [authentik_core.application, [slug, home-assistant-app]]
      order: 0
      enabled: true
      negate: false
      timeout: 30
  # Proxy outpost — self-managed K8s deployment, no service_connection needed
  - model: authentik_outposts.outpost
    state: present
    identifiers:
      name: proxy-outpost
    attrs:
      name: proxy-outpost
      type: proxy
      providers:
        - !Find [authentik_providers_proxy.proxyprovider, [name, firefly-proxy]]
        - !Find [authentik_providers_proxy.proxyprovider, [name, grimmory-proxy]]
        - !Find [authentik_providers_proxy.proxyprovider, [name, aurral-proxy]]
      config:
        authentik_host: "https://auth.sulibot.com"
        log_level: info
