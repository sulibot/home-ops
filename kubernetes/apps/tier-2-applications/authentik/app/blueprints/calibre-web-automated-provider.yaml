version: 1
metadata:
  name: Calibre-Web-Automated OIDC Provider
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  - model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: calibre-web-automated
    attrs:
      name: calibre-web-automated
      client_id: !Env CALIBRE_WEB_AUTOMATED_OIDC_CLIENT_ID
      client_secret: !Env CALIBRE_WEB_AUTOMATED_OIDC_CLIENT_SECRET
      redirect_uris:
        - url: "https://calibre-web-automated.sulibot.com/login/generic/authorized"
          matching_mode: strict
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      issuer_mode: per_provider
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
  - model: authentik_core.application
    state: present
    identifiers:
      slug: calibre-web-automated
    attrs:
      name: Calibre-Web-Automated
      slug: calibre-web-automated
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, calibre-web-automated]]
      meta_launch_url: "https://calibre-web-automated.sulibot.com"
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, policy-access-standard]]
      target: !Find [authentik_core.application, [slug, calibre-web-automated]]
      order: 0
    attrs:
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, policy-access-standard]]
      target: !Find [authentik_core.application, [slug, calibre-web-automated]]
      order: 0
      enabled: true
      negate: false
      timeout: 30
