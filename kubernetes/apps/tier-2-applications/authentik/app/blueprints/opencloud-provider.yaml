version: 1
metadata:
  name: OpenCloud OIDC Provider
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  - model: authentik_policies.policybinding
    state: absent
    identifiers:
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, policy-access-standard]]
      target: !Find [authentik_core.application, [slug, opencloud-desktop]]
      order: 0
  - model: authentik_core.application
    state: absent
    identifiers:
      slug: opencloud-desktop
  - model: authentik_providers_oauth2.oauth2provider
    state: absent
    identifiers:
      name: opencloud-desktop
  - model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: opencloud
    attrs:
      name: opencloud
      client_type: public
      client_id: !Env OPENCLOUD_OIDC_CLIENT_ID
      redirect_uris:
        - url: "https://opencloud.sulibot.com/oidc-callback.html"
          matching_mode: strict
        - url: "https://opencloud.sulibot.com/oidc-silent-redirect.html"
          matching_mode: strict
        - url: "https://opencloud.sulibot.com/"
          matching_mode: strict
        - url: "^http://127\\.0\\.0\\.1:[0-9]+/?$"
          matching_mode: regex
        - url: "^http://localhost:[0-9]+/?$"
          matching_mode: regex
      authentication_flow: !Find [authentik_flows.flow, [slug, sulibot-internal-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      issuer_mode: per_provider
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, offline_access]]
  - model: authentik_core.application
    state: present
    identifiers:
      slug: opencloud
    attrs:
      name: OpenCloud
      slug: opencloud
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, opencloud]]
      meta_launch_url: "https://opencloud.sulibot.com"
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, policy-access-standard]]
      target: !Find [authentik_core.application, [slug, opencloud]]
      order: 0
    attrs:
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, policy-access-standard]]
      target: !Find [authentik_core.application, [slug, opencloud]]
      order: 0
      enabled: true
      negate: false
      timeout: 30
