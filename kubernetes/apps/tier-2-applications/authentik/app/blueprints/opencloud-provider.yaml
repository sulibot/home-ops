version: 1
metadata:
  name: OpenCloud OIDC Provider
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  - model: authentik_core.group
    state: present
    identifiers:
      name: opencloud-users
    attrs:
      name: opencloud-users
  - model: authentik_core.group
    state: present
    identifiers:
      name: opencloud-admins
    attrs:
      name: opencloud-admins
  - model: authentik_policies_expression.expressionpolicy
    state: present
    identifiers:
      name: policy-access-opencloud
    attrs:
      name: policy-access-opencloud
      expression: |
        user = request.user
        if not user or user.is_anonymous:
            return False
        groups = {group.name for group in user.groups.all()}
        return bool(groups & {"opencloud-users", "opencloud-admins"})
  - model: authentik_providers_oauth2.scopemapping
    state: present
    identifiers:
      name: OpenCloud storage identity
    attrs:
      name: OpenCloud storage identity
      scope_name: storage
      description: Stable OpenCloud identity with explicit application-to-POSIX links
      expression: |
        # Join infrastructure identities by the immutable Authentik UUID. The
        # Kanidm UUID is added to this link after identity reconciliation.
        storage_links = {
            "0b75cb54-d109-4876-bf4a-cc90a570134c": {
                "storage_username": "sulibot",
                "kanidm_uuid": "1a8cb2c5-a67a-4010-a01b-43db708ec7e5",
            },
        }
        link = storage_links.get(str(request.user.uuid), {})
        storage_username = (
            request.user.attributes.get("storage_username", "")
            or link.get("storage_username", "")
        )
        kanidm_uuid = (
            request.user.attributes.get("kanidm_uuid", "")
            or link.get("kanidm_uuid", "")
        )
        groups = [group.name for group in request.user.groups.all()]
        opencloud_groups = [
            group for group in groups
            if group in {"opencloud-users", "opencloud-admins"}
        ]
        opencloud_roles = (
            ["opencloudAdmin"]
            if "opencloud-admins" in groups
            else ["opencloudUser"]
        )
        return {
            # Keep existing POSIX-backed users stable while giving application-
            # only users a valid OpenCloud identity that grants no Unix access.
            "opencloud_username": storage_username or request.user.username,
            "storage_username": storage_username,
            "kanidm_uuid": kanidm_uuid,
            # OpenCloud JIT provisioning mirrors these Authentik memberships so
            # Spaces can be assigned to groups instead of individual accounts.
            "opencloudGroups": opencloud_groups,
            # System-wide OpenCloud roles remain group-driven and independent
            # from the narrower Kanidm POSIX storage entitlement.
            "roles": opencloud_roles,
        }
  - model: authentik_policies.policybinding
    state: absent
    identifiers:
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, policy-access-standard]]
      target: !Find [authentik_core.application, [slug, opencloud-desktop]]
      order: 0
  - model: authentik_core.application
    state: absent
    identifiers:
      slug: opencloud-desktop
  - model: authentik_providers_oauth2.oauth2provider
    state: absent
    identifiers:
      name: opencloud-desktop
  - model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: opencloud
    attrs:
      name: opencloud
      client_type: public
      client_id: !Env OPENCLOUD_OIDC_CLIENT_ID
      redirect_uris:
        - url: "https://opencloud.sulibot.com/oidc-callback.html"
          matching_mode: strict
        - url: "https://opencloud.sulibot.com/oidc-silent-redirect.html"
          matching_mode: strict
        - url: "https://opencloud.sulibot.com/"
          matching_mode: strict
        - url: "^http://127\\.0\\.0\\.1:[0-9]+/?$"
          matching_mode: regex
        - url: "^http://localhost:[0-9]+/?$"
          matching_mode: regex
      authentication_flow: !Find [authentik_flows.flow, [slug, sulibot-internal-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      issuer_mode: per_provider
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, offline_access]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, storage]]
  - model: authentik_core.application
    state: present
    identifiers:
      slug: opencloud
    attrs:
      name: OpenCloud
      slug: opencloud
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, opencloud]]
      meta_launch_url: "https://opencloud.sulibot.com"
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    state: absent
    identifiers:
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, policy-access-infrastructure]]
      target: !Find [authentik_core.application, [slug, opencloud]]
      order: 0
  - model: authentik_policies.policybinding
    state: present
    identifiers:
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, policy-access-opencloud]]
      target: !Find [authentik_core.application, [slug, opencloud]]
      order: 0
    attrs:
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, policy-access-opencloud]]
      target: !Find [authentik_core.application, [slug, opencloud]]
      order: 0
      enabled: true
      negate: false
      timeout: 30
  - model: authentik_policies.policybinding
    state: absent
    identifiers:
      policy: !Find [authentik_policies_expression.expressionpolicy, [name, policy-access-standard]]
      target: !Find [authentik_core.application, [slug, opencloud]]
      order: 0
