version: 1
metadata:
  name: Host-specific Authentik Login Flows
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  # Reusable login flow pattern:
  # - All requests use one shared flow.
  # - Local Authentik users, Google users, and Kanidm users can all log in.
  # - Only Google/Kanidm users can self-register, via their source enrollment flows.
  - model: authentik_stages_identification.identificationstage
    state: present
    identifiers:
      name: sulibot-shared-auth-identification
    attrs:
      name: sulibot-shared-auth-identification
      user_fields:
        - email
      password_stage: !Find [authentik_stages_password.passwordstage, [name, default-authentication-password]]
      sources:
        - !Find [authentik_sources_oauth.oauthsource, [slug, google]]
        - !Find [authentik_sources_oauth.oauthsource, [slug, kanidm]]
      show_source_labels: true
  - model: authentik_flows.flow
    state: present
    identifiers:
      slug: sulibot-internal-authentication-flow
    attrs:
      name: Sulibot Internal Authentication
      slug: sulibot-internal-authentication-flow
      title: "Sign in"
      designation: authentication
      layout: stacked
  - model: authentik_flows.flowstagebinding
    state: present
    identifiers:
      target: !Find [authentik_flows.flow, [slug, sulibot-internal-authentication-flow]]
      stage: !Find [authentik_stages_identification.identificationstage, [name, sulibot-shared-auth-identification]]
      order: 10
    attrs:
      target: !Find [authentik_flows.flow, [slug, sulibot-internal-authentication-flow]]
      stage: !Find [authentik_stages_identification.identificationstage, [name, sulibot-shared-auth-identification]]
      order: 10
  - model: authentik_flows.flowstagebinding
    state: present
    identifiers:
      target: !Find [authentik_flows.flow, [slug, sulibot-internal-authentication-flow]]
      stage: !Find [authentik_stages_authenticator_validate.authenticatorvalidatestage, [name, default-authentication-mfa-validation]]
      order: 40
    attrs:
      target: !Find [authentik_flows.flow, [slug, sulibot-internal-authentication-flow]]
      stage: !Find [authentik_stages_authenticator_validate.authenticatorvalidatestage, [name, default-authentication-mfa-validation]]
      order: 40
  - model: authentik_flows.flowstagebinding
    state: present
    identifiers:
      target: !Find [authentik_flows.flow, [slug, sulibot-internal-authentication-flow]]
      stage: !Find [authentik_stages_user_login.userloginstage, [name, default-authentication-login]]
      order: 100
    attrs:
      target: !Find [authentik_flows.flow, [slug, sulibot-internal-authentication-flow]]
      stage: !Find [authentik_stages_user_login.userloginstage, [name, default-authentication-login]]
      order: 100
  # Provider OIDC logout should also clear the main Authentik session.
  # Without this, RP-initiated logout only invalidates the provider/app
  # session and the next login can silently reuse the previous Google user.
  - model: authentik_flows.flowstagebinding
    state: present
    identifiers:
      target: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      stage: !Find [authentik_stages_user_logout.userlogoutstage, [name, default-invalidation-logout]]
      order: 10
    attrs:
      target: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      stage: !Find [authentik_stages_user_logout.userlogoutstage, [name, default-invalidation-logout]]
      order: 10
  # Host-specific brand:
  # - auth.sulibot.com uses the shared authentication flow.
  - model: authentik_brands.brand
    state: present
    identifiers:
      domain: auth.sulibot.com
    attrs:
      domain: auth.sulibot.com
      branding_title: authentik
      branding_logo: branding/logo.svg
      branding_favicon: branding/logo-192.png
      branding_default_flow_background: branding/frosted-flow.jpg
      branding_custom_css: !Format
        - |
          %s

          /* Replace the upstream demo identity without modifying vendored CSS. */
          :host(ak-flow-executor) .pf-c-login__main-header.pf-c-brand::after,
          .pf-c-login__main-header.pf-c-brand::after,
          body:has(#ak-back-home) .pf-c-login__main-header.pf-c-brand::after {
            content: "sulibot.com" !important;
          }
        - !File /data/media/public/branding/frosted-theme.css
      attributes:
        settings:
          theme:
            base: dark
            background: >
              background:
                radial-gradient(circle at 15% 10%, rgba(62, 132, 180, 0.16), transparent 35%),
                radial-gradient(circle at 85% 85%, rgba(72, 79, 112, 0.12), transparent 35%),
                linear-gradient(135deg, #05070b 0%, #0a1018 55%, #080b10 100%);
              background-attachment: fixed;
          layout:
            type: 3-column
          navbar:
            userDisplay: name
          enabledFeatures:
            search: true
            settings: true
            apiDrawer: false
            applicationEdit: false
            notificationDrawer: false
      flow_authentication: !Find [authentik_flows.flow, [slug, sulibot-internal-authentication-flow]]
  - model: authentik_brands.brand
    state: present
    identifiers:
      domain: authentik-default
    attrs:
      domain: authentik-default
