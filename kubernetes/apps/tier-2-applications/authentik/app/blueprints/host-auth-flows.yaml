version: 1
metadata:
  name: Host-specific Authentik Login Flows
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  # Reusable login flow pattern:
  # - All requests use one shared flow.
  # - Local Authentik users, Google users, and Kanidm users can all log in.
  # - Only Google/Kanidm users can self-register, via their source enrollment flows.
  - model: authentik_stages_identification.identificationstage
    state: present
    identifiers:
      name: sulibot-shared-auth-identification
    attrs:
      name: sulibot-shared-auth-identification
      user_fields:
        - email
      password_stage: !Find [authentik_stages_password.passwordstage, [name, default-authentication-password]]
      sources:
        - !Find [authentik_sources_oauth.oauthsource, [slug, google]]
        - !Find [authentik_sources_oauth.oauthsource, [slug, kanidm]]
      show_source_labels: true
  - model: authentik_flows.flow
    state: present
    identifiers:
      slug: sulibot-internal-authentication-flow
    attrs:
      name: Sulibot Internal Authentication
      slug: sulibot-internal-authentication-flow
      title: "Sign in"
      designation: authentication
  - model: authentik_flows.flowstagebinding
    state: present
    identifiers:
      target: !Find [authentik_flows.flow, [slug, sulibot-internal-authentication-flow]]
      stage: !Find [authentik_stages_identification.identificationstage, [name, sulibot-shared-auth-identification]]
      order: 10
    attrs:
      target: !Find [authentik_flows.flow, [slug, sulibot-internal-authentication-flow]]
      stage: !Find [authentik_stages_identification.identificationstage, [name, sulibot-shared-auth-identification]]
      order: 10
  - model: authentik_flows.flowstagebinding
    state: present
    identifiers:
      target: !Find [authentik_flows.flow, [slug, sulibot-internal-authentication-flow]]
      stage: !Find [authentik_stages_authenticator_validate.authenticatorvalidatestage, [name, default-authentication-mfa-validation]]
      order: 40
    attrs:
      target: !Find [authentik_flows.flow, [slug, sulibot-internal-authentication-flow]]
      stage: !Find [authentik_stages_authenticator_validate.authenticatorvalidatestage, [name, default-authentication-mfa-validation]]
      order: 40
  - model: authentik_flows.flowstagebinding
    state: present
    identifiers:
      target: !Find [authentik_flows.flow, [slug, sulibot-internal-authentication-flow]]
      stage: !Find [authentik_stages_user_login.userloginstage, [name, default-authentication-login]]
      order: 100
    attrs:
      target: !Find [authentik_flows.flow, [slug, sulibot-internal-authentication-flow]]
      stage: !Find [authentik_stages_user_login.userloginstage, [name, default-authentication-login]]
      order: 100
  # Provider OIDC logout should also clear the main Authentik session.
  # Without this, RP-initiated logout only invalidates the provider/app
  # session and the next login can silently reuse the previous Google user.
  - model: authentik_flows.flowstagebinding
    state: present
    identifiers:
      target: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      stage: !Find [authentik_stages_user_logout.userlogoutstage, [name, default-invalidation-logout]]
      order: 10
    attrs:
      target: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      stage: !Find [authentik_stages_user_logout.userlogoutstage, [name, default-invalidation-logout]]
      order: 10
  # Host-specific brand:
  # - auth.sulibot.com uses the shared authentication flow.
  - model: authentik_brands.brand
    state: present
    identifiers:
      domain: auth.sulibot.com
    attrs:
      domain: auth.sulibot.com
      branding_title: authentik
      branding_custom_css: |
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        .pf-c-login,
        .pf-c-login * {
          font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif !important;
        }
        .pf-c-login {
          --sb-bg: #061a2b;
          --sb-surface: #0c2238;
          --sb-border: #2d4f79;
          --sb-text: #e6edf5;
          --sb-muted: #b6c5d6;
          --sb-focus: #61a8ff;
          --sb-local: #ff7a00;
          --sb-local-hover: #e06b00;
          --sb-google: #2b7fe0;
          --sb-google-hover: #246fc3;
          --pf-global--Color--100: var(--sb-text);
          --pf-global--Color--200: var(--sb-muted);
          --pf-global--primary-color--100: var(--sb-google);
          --pf-global--link--Color: var(--sb-text);
          --pf-v5-global--Color--100: var(--sb-text);
          --pf-v5-global--Color--200: var(--sb-muted);
          --pf-v5-global--primary-color--100: var(--sb-google);
          --pf-v5-global--link--Color: var(--sb-text);
          --pf-t--global--text--color--regular: var(--sb-text);
          --pf-t--global--text--color--subtle: var(--sb-muted);
          --pf-t--global--text--color--link--default: var(--sb-text);
          --pf-t--global--background--color--primary--default: var(--sb-surface);
          color: var(--sb-text) !important;
        }
        .pf-c-login__main {
          max-width: 460px !important;
          width: min(92vw, 460px) !important;
          border-radius: 22px !important;
          padding: clamp(24px, 4vw, 38px) !important;
          background: linear-gradient(180deg, #0d243b 0%, #091a2a 100%) !important;
          border: 1px solid rgba(112, 159, 217, 0.25) !important;
          box-shadow: 0 20px 48px rgba(0, 0, 0, 0.45) !important;
        }
        .pf-c-login__main-header.pf-c-brand {
          padding-bottom: 12px !important;
        }
        .pf-c-login__main-header.pf-c-brand img,
        .pf-c-login__main-header .pf-c-brand img {
          width: clamp(84px, 24vw, 112px) !important;
          height: auto !important;
          margin: 0 auto 12px !important;
          display: block !important;
        }
        .pf-c-login__main .pf-c-title {
          color: var(--sb-text) !important;
          font-size: clamp(30px, 3.6vw, 40px) !important;
          line-height: 1.1 !important;
          margin: 4px 0 6px !important;
          letter-spacing: -0.02em !important;
        }
        .pf-c-login__main-body {
          margin-top: 6px !important;
        }
        .pf-c-login__main-body p,
        .pf-c-login__main-body .pf-c-content {
          color: var(--sb-muted) !important;
        }
        .pf-c-form {
          margin-top: 16px !important;
        }
        .pf-c-form__group {
          margin-bottom: 14px !important;
        }
        .pf-c-form__label-text {
          color: var(--sb-muted) !important;
          font-size: 13px !important;
          letter-spacing: 0.01em !important;
        }
        .pf-c-form-control,
        .pf-c-input-group .pf-c-form-control {
          height: 52px !important;
          border-radius: 14px !important;
          background: #132b45 !important;
          border: 1px solid var(--sb-border) !important;
          color: var(--sb-text) !important;
          padding: 0 14px !important;
        }
        .pf-c-form-control::placeholder {
          color: #9eb4ca !important;
          opacity: 0.95 !important;
        }
        .pf-c-form-control:focus,
        .pf-c-input-group .pf-c-form-control:focus {
          border-color: var(--sb-focus) !important;
          box-shadow: 0 0 0 3px rgba(97, 168, 255, 0.28) !important;
        }
        .pf-c-input-group {
          border-radius: 14px !important;
          overflow: hidden !important;
          border: 1px solid var(--sb-border) !important;
          background: #132b45 !important;
        }
        .pf-c-input-group .pf-c-form-control {
          border: 0 !important;
          box-shadow: none !important;
        }
        .pf-c-input-group .pf-c-button {
          min-width: 52px !important;
          border: 0 !important;
          border-left: 1px solid rgba(140, 173, 207, 0.35) !important;
          border-radius: 0 !important;
          background: rgba(147, 180, 215, 0.16) !important;
          color: var(--sb-text) !important;
        }
        .pf-c-divider {
          margin: 22px 0 18px !important;
          border-top-color: rgba(165, 188, 212, 0.34) !important;
        }
        .pf-c-login__main .pf-c-button.pf-m-primary {
          min-height: 52px !important;
          border-radius: 12px !important;
          font-weight: 600 !important;
          font-size: 18px !important;
          letter-spacing: 0.01em !important;
          transition: all 0.16s ease !important;
        }
        .pf-c-login__main-body .pf-c-button.pf-m-primary {
          background: var(--sb-local) !important;
          border-color: var(--sb-local) !important;
          color: #fff !important;
        }
        .pf-c-login__main-body .pf-c-button.pf-m-primary:hover,
        .pf-c-login__main-body .pf-c-button.pf-m-primary:focus {
          background: var(--sb-local-hover) !important;
          border-color: var(--sb-local-hover) !important;
        }
        ak-stage-identification::part(source-item) {
          width: min(100%, 286px) !important;
          min-height: 52px !important;
          margin: 0 auto !important;
          display: flex !important;
          align-items: center !important;
          justify-content: center !important;
          gap: 12px !important;
          border-radius: 12px !important;
          background: #ffffff !important;
          border: 1px solid #d8e2ee !important;
          color: #172033 !important;
          font-weight: 650 !important;
          font-size: 17px !important;
          box-shadow: 0 8px 20px rgba(0, 0, 0, 0.22) !important;
        }
        ak-stage-identification::part(source-list) {
          justify-content: center !important;
        }
        .pf-c-login__main-footer .pf-c-button,
        .pf-c-login__main a[href*="/source/oauth/login/google/"] {
          min-height: 52px !important;
          border-radius: 12px !important;
          background: var(--sb-google) !important;
          border-color: var(--sb-google) !important;
          color: #fff !important;
          font-weight: 600 !important;
          font-size: 18px !important;
        }
        ak-stage-identification::part(source-item):hover,
        ak-stage-identification::part(source-item):focus {
          background: #f8fbff !important;
          border-color: #ffffff !important;
          color: #111827 !important;
          box-shadow: 0 0 0 3px rgba(97, 168, 255, 0.28), 0 8px 20px rgba(0, 0, 0, 0.22) !important;
        }
        .pf-c-login__main-footer .pf-c-button:hover,
        .pf-c-login__main-footer .pf-c-button:focus,
        .pf-c-login__main a[href*="/source/oauth/login/google/"]:hover,
        .pf-c-login__main a[href*="/source/oauth/login/google/"]:focus {
          background: var(--sb-google-hover) !important;
          border-color: var(--sb-google-hover) !important;
        }
        ak-stage-identification::part(source-icon) {
          width: 24px !important;
          height: 24px !important;
          flex: 0 0 auto !important;
        }
        .pf-c-login__main-footer .pf-c-button *,
        .pf-c-login__main a[href*="/source/oauth/login/google/"] * {
          color: #fff !important;
          fill: #fff !important;
        }
      flow_authentication: !Find [authentik_flows.flow, [slug, sulibot-internal-authentication-flow]]
  - model: authentik_brands.brand
    state: present
    identifiers:
      domain: authentik-default
    attrs:
      domain: authentik-default
