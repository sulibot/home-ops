---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openhands
spec:
  chartRef:
    kind: OCIRepository
    name: openhands
  interval: 1h
  timeout: 10m
  maxHistory: 3
  install:
    remediation:
      retries: 5
    timeout: 10m
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 5
      strategy: rollback
    timeout: 10m
  values:
    controllers:
      openhands:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/openhands/agent-canvas
              tag: 1.12.0@sha256:2c31423cdc1ec6007959790535682f3f7a1c141cd5b9d66e1344ac013d31223b
            env:
              TZ: America/Los_Angeles
              # LiteLLM provider/model string; talks directly to the Anthropic API using LLM_API_KEY below.
              LLM_MODEL: anthropic/claude-sonnet-4-5-20250929
            envFrom:
              - secretRef:
                  name: openhands-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /alive
                    port: &port 8000
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /alive
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /alive
                    port: *port
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 60
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                memory: 4Gi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        controller: openhands
        ports:
          http:
            port: *port

    route:
      app:
        hostnames:
          - openhands.sulibot.com
        parentRefs:
          - name: gateway-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port

    persistence:
      # Single volume backing both $HOME/.openhands (settings, secrets, conversation
      # history, automation sqlite db) and $HOME/workspace (cloned repos, generated
      # files), mirroring upstream's agent-canvas Helm chart layout.
      config:
        enabled: true
        existingClaim: "{{ .Release.Name }}-config"
        globalMounts:
          - path: /home/openhands/.openhands
            subPath: openhands
          - path: /home/openhands/workspace
            subPath: workspace
