---
apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: openhands
spec:
  target:
    service: openhands
    port: 8000
  rules:
    - hosts:
        - openhands.sulibot.com
  scalingMetric:
    concurrency:
      targetValue: 5
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: openhands-http
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: openhands
  minReplicaCount: 0
  maxReplicaCount: 1
  cooldownPeriod: 1800
  triggers:
    - type: external-push
      metadata:
        scalerAddress: keda-add-ons-http-external-scaler.observability:9090
        interceptorRoute: openhands
