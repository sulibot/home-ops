---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openhands
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: openhands-secret
    creationPolicy: Owner
    template:
      data:
        # Agent Canvas defaults to running the bundled Claude Code CLI via ACP,
        # which authenticates via the CLI's own ANTHROPIC_API_KEY convention —
        # not LLM_API_KEY (that only feeds the alternate native-LiteLLM agent path).
        ANTHROPIC_API_KEY: "{{ .ANTHROPIC_API_KEY }}"
        LLM_API_KEY: "{{ .ANTHROPIC_API_KEY }}"
  dataFrom:
    - extract:
        key: openhands
