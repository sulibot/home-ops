---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich-frame
spec:
  chartRef:
    kind: OCIRepository
    name: immich-frame
  interval: 1h
  timeout: 10m
  maxHistory: 3
  install:
    remediation:
      retries: 5
    timeout: 10m
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 5
      strategy: rollback
    timeout: 10m
  values:
    controllers:
      immich-frame:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          migrate-settings:
            image:
              repository: docker.io/library/python
              tag: 3.14-alpine
            command:
              - python3
              - -c
              - |
                import json, os
                from pathlib import Path
                config = Path('/app/Config')
                settings = config / 'Settings.json'
                if not settings.exists() and not (config / 'immichframe.db').exists():
                    settings.write_text(json.dumps({
                        'General': {
                            'AuthenticationSecret': os.environ['AuthenticationSecret'],
                            'ClockFormat': 'HH:mm',
                            'PhotoDateFormat': 'yyyy-MM-dd',
                            'UnitSystem': 'metric',
                            'WeatherLatLong': '37.773972,-122.431297',
                        },
                        'Accounts': [{
                            'ImmichServerUrl': os.environ['ImmichServerUrl'],
                            'ApiKey': os.environ['ApiKey'],
                        }],
                    }))
                    settings.chmod(0o600)
            env:
              ApiKey:
                valueFrom:
                  secretKeyRef:
                    name: immich-frame-secret
                    key: IMMICH_API_KEY
              ImmichServerUrl:
                valueFrom:
                  secretKeyRef:
                    name: immich-frame-secret
                    key: IMMICH_URL
            envFrom:
              - secretRef:
                  name: immich-frame-keys
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
        containers:
          app:
            image:
              repository: ghcr.io/immichframe/immichframe
              tag: v1.0.39.0@sha256:b4bd2ac6ec75c0117a24bd627dc0b449d485ac87ec3a410c73d5db05a4bbfcaf
            env:
              IMMICHFRAME_CONFIG_PATH: /app/Config
              TZ: America/Los_Angeles
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 15m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      annotations:
        k8s.v1.cni.cncf.io/networks: |-
          [
            {
              "name": "vlan31",
              "namespace": "kube-system",
              "ips": ["10.31.0.7/24", "fd00:31::7/64"]
            }
          ]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: immich-frame
        ports:
          http:
            port: 8080
    route:
      app:
        hostnames:
          - immich-frame.sulibot.com
        parentRefs:
          - name: gateway-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: http
    persistence:
      config:
        type: persistentVolumeClaim
        accessMode: ReadWriteMany
        storageClass: csi-cephfs-config-sc
        size: 1Gi
        globalMounts:
          - path: /app/Config
      tmp:
        type: emptyDir
