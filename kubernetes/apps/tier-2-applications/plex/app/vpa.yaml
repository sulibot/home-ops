---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: plex
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: plex
  updatePolicy:
    updateMode: "Auto"
    minReplicas: 1
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        controlledResources: ["cpu", "memory"]
        controlledValues: RequestsOnly
        minAllowed:
          cpu: 10m
          memory: 1Gi
        maxAllowed:
          cpu: "4"
          # Bound the reservation so Plex can schedule on the 16 GiB GPU nodes.
          # RequestsOnly leaves actual memory usage unrestricted by this cap.
          memory: 4Gi
