---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mealie-pg
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: mealie-pg-password
    creationPolicy: Owner
    template:
      data:
        username: mealie
        password: '{{ .POSTGRES_PASSWORD }}'
  dataFrom:
    - extract:
        key: mealie
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mealie-bootstrap
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: mealie-bootstrap
    creationPolicy: Owner
    template:
      data:
        username: '{{ .username }}'
        password: '{{ .password }}'
  dataFrom:
    - extract:
        key: mealie
