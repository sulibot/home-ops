---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./ocirepository.yaml
  - ./pvc.yaml
  - ./volsync-externalsecret.yaml
  - ./volsync-replicationsource.yaml
configMapGenerator:
  - name: fileflows-production
    files:
      - production.py=./resources/production.py
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
