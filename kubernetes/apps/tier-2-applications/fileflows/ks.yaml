---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: fileflows
  namespace: flux-system
  labels:
    layer: applications
    component: application
    critical: "false"
spec:
  dependsOn:
    - name: secrets-ready
      namespace: flux-system
    - name: storage-ready
      namespace: flux-system
  interval: 15m
  retryInterval: 30s
  path: ./kubernetes/apps/tier-2-applications/fileflows/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  wait: false
