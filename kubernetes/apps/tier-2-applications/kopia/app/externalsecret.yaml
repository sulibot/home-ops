---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopia
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: kopia-secret
    template:
      data:
        AWS_ACCESS_KEY_ID: "{{ .AWS_ACCESS_KEY_ID }}"
        AWS_DEFAULT_REGION: "{{ .AWS_DEFAULT_REGION }}"
        AWS_REGION: "{{ .AWS_REGION }}"
        AWS_S3_ENDPOINT: "{{ .AWS_S3_ENDPOINT }}"
        KOPIA_PASSWORD: "{{ .KOPIA_PASSWORD }}"
        KOPIA_REPOSITORY: "{{ .KOPIA_REPOSITORY }}"
        KOPIA_S3_ENDPOINT: "{{ .KOPIA_S3_ENDPOINT }}"
        KOPIA_SERVER_PASSWORD: "{{ .KOPIA_SERVER_PASSWORD }}"
        KOPIA_SERVER_USERNAME: "{{ .KOPIA_SERVER_USERNAME }}"
        AWS_SECRET_ACCESS_KEY: "{{ .AWS_SECRET_ACCESS_KEY }}"
  data:
    - secretKey: KOPIA_SERVER_USERNAME
      remoteRef:
        key: kopia-console
        property: username
    - secretKey: KOPIA_SERVER_PASSWORD
      remoteRef:
        key: kopia-console
        property: password
  dataFrom:
    - extract:
        key: volsync-template
