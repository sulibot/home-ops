---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name onward-runner
spec:
  chartRef:
    kind: OCIRepository
    name: gha-runner-scale-set
  interval: 1h
  timeout: 10m
  maxHistory: 3
  install:
    remediation:
      retries: 5
    timeout: 10m
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 5
      strategy: rollback
    timeout: 10m
  values:
    githubConfigUrl: https://github.com/sulibot/onward
    githubConfigSecret: onward-runner-secret
    minRunners: 0
    # The normal burst contract has exactly two independent profiles. Keep the
    # ceiling aligned with useful parallelism and the shared admission quota.
    maxRunners: 2
    # Aggregate at metric creation time. Excluding git refs, job names, and run
    # IDs keeps series cardinality bounded without scrape-time label collapse.
    listenerMetrics:
      counters:
        gha_started_jobs_total:
          labels: [repository, event_name, job_workflow_name]
        gha_completed_jobs_total:
          labels: [repository, event_name, job_result, job_workflow_name]
      gauges:
        gha_assigned_jobs:
          labels: [name, repository]
        gha_running_jobs:
          labels: [name, repository]
        gha_registered_runners:
          labels: [name, repository]
        gha_busy_runners:
          labels: [name, repository]
        gha_min_runners:
          labels: [name, repository]
        gha_max_runners:
          labels: [name, repository]
        gha_desired_runners:
          labels: [name, repository]
        gha_idle_runners:
          labels: [name, repository]
      histograms:
        gha_job_startup_duration_seconds:
          labels: [repository, event_name, job_workflow_name]
          buckets: [1, 2, 5, 10, 20, 30, 60, 120, 300, 600]
        gha_job_execution_duration_seconds:
          labels: [repository, event_name, job_result, job_workflow_name]
          buckets: [5, 15, 30, 60, 120, 300, 600, 1200, 1800, 3600, 7200]
    controllerServiceAccount:
      name: actions-runner-controller
      namespace: actions-runner-system
    template:
      spec:
        # Fast/security profiles run in the ephemeral runner pod and must not
        # receive Kubernetes API credentials or access ARC App secrets.
        automountServiceAccountToken: false
        priorityClassName: agentic-verification
        securityContext:
          fsGroup: 1001
          fsGroupChangePolicy: OnRootMismatch
        volumes:
          - name: work
            ephemeral:
              volumeClaimTemplate:
                spec:
                  accessModes:
                    - ReadWriteOnce
                  storageClassName: csi-rbd-rbd-vm-sc
                  resources:
                    requests:
                      storage: 25Gi
        containers:
          - name: runner
            image: ghcr.io/home-operations/actions-runner:2.337.0@sha256:8b8e8326b5a08e658a0a41cfd2867afab69ca4194a152f986aa6fcd5430d09e7
            command:
              - /home/runner/run.sh
            volumeMounts:
              - name: work
                mountPath: /home/runner/_work
            env:
              - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
                value: "false"
              - name: NODE
                valueFrom:
                  fieldRef:
                    fieldPath: status.hostIP
            resources:
              requests:
                # Measured 24h peaks were ~3.5 CPU and 2.95 GiB working set.
                # Requests must be honest enough for safe scheduler bin-packing.
                cpu: "1"
                memory: 3Gi
              limits:
                cpu: "4"
                memory: 4Gi
