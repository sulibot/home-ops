---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: onward-runner
spec:
  chartRef:
    kind: OCIRepository
    name: gha-runner-scale-set
  interval: 1h
  timeout: 10m
  maxHistory: 3
  install:
    remediation:
      retries: 5
    timeout: 10m
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 5
      strategy: rollback
    timeout: 10m
  values:
    githubConfigUrl: https://github.com/sulibot/onward
    githubConfigSecret: onward-runner-secret
    # Keep no idle runner pod; ARC creates runners when GitHub queues a job.
    minRunners: 0
    maxRunners: 3
    # Aggregate at metric creation time. Excluding git refs and run IDs keeps
    # series cardinality bounded without collapsing samples during scraping.
    listenerMetrics:
      counters:
        gha_started_jobs_total:
          labels: [repository, job_name, event_name, job_workflow_name]
        gha_completed_jobs_total:
          labels: [repository, job_name, event_name, job_result, job_workflow_name]
      gauges:
        gha_assigned_jobs:
          labels: [name, repository]
        gha_running_jobs:
          labels: [name, repository]
        gha_registered_runners:
          labels: [name, repository]
        gha_busy_runners:
          labels: [name, repository]
        gha_min_runners:
          labels: [name, repository]
        gha_max_runners:
          labels: [name, repository]
        gha_desired_runners:
          labels: [name, repository]
        gha_idle_runners:
          labels: [name, repository]
      histograms:
        gha_job_startup_duration_seconds:
          labels: [repository, event_name, job_workflow_name]
          buckets: [5, 15, 30, 60, 120, 300, 600, 1200, 3600]
        gha_job_execution_duration_seconds:
          labels: [repository, event_name, job_result, job_workflow_name]
          buckets: [5, 15, 30, 60, 120, 300, 600, 1200, 3600]
    controllerServiceAccount:
      name: actions-runner-controller
      namespace: actions-runner-system
    template:
      metadata:
        labels:
          network.sulibot.com/role: ci-runner
      spec:
        # Fast/security profiles need no job container. Running directly in the
        # ephemeral runner pod removes workflow access to the Kubernetes API and
        # to the namespace-scoped ARC GitHub App secret.
        automountServiceAccountToken: false
        securityContext:
          fsGroup: 1001
          fsGroupChangePolicy: OnRootMismatch
        containers:
          - name: runner
            image: ghcr.io/home-operations/actions-runner:2.337.0@sha256:8b8e8326b5a08e658a0a41cfd2867afab69ca4194a152f986aa6fcd5430d09e7
            command:
              - /home/runner/run.sh
            env:
              - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
                value: "false"
              - name: NODE
                valueFrom:
                  fieldRef:
                    fieldPath: status.hostIP
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                cpu: "4"
                memory: 4Gi
