---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: agentic-verification
description: Preemptible, elastic agent verification workers.
preemptionPolicy: Never
value: -10
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: agentic-verification
  namespace: actions-runner-system
spec:
  # Two quick pods (1 CPU/3 Gi each) plus one Full pod (1 CPU/4 Gi)
  # total 3 pods, 3 CPU and 10 Gi. Keep one pod, 1 CPU and 3 Gi of admission
  # headroom so normal saturation does not look like an exhausted namespace.
  hard:
    count/pods: "4"
    requests.cpu: "4"
    requests.memory: 13Gi
  scopeSelector:
    matchExpressions:
      - operator: In
        scopeName: PriorityClass
        values:
          - agentic-verification
