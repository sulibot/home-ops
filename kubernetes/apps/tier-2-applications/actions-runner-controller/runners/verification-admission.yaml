---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: agentic-verification
description: Preemptible, elastic agent verification workers.
preemptionPolicy: Never
value: -10
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: agentic-verification
  namespace: actions-runner-system
spec:
  # Keep one pod of admission headroom above maxRunners. The scale-set ceiling
  # remains two; matching the quota exactly makes normal saturation look like
  # an exhausted-namespace incident to kube-prometheus-stack.
  hard:
    count/pods: "3"
    requests.cpu: "3"
    requests.memory: 9Gi
  scopeSelector:
    matchExpressions:
      - operator: In
        scopeName: PriorityClass
        values:
          - agentic-verification
