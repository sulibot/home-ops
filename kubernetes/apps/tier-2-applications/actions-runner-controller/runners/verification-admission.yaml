---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: agentic-verification
description: Preemptible, elastic agent verification workers.
preemptionPolicy: Never
value: -10
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: agentic-verification
  namespace: actions-runner-system
spec:
  hard:
    count/pods: "2"
    requests.cpu: "2"
    requests.memory: 6Gi
  scopeSelector:
    matchExpressions:
      - operator: In
        scopeName: PriorityClass
        values:
          - agentic-verification
