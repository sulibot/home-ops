---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: actions-runner-jobs-onward
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: actions-runner-system
      actions.github.com/scale-set-name: onward-runner
      app.kubernetes.io/component: runner
  enableDefaultDeny:
    ingress: true
    egress: true
  # Cilium enables default-deny per direction only when that rule section is
  # present. One empty rule turns ingress enforcement on without allowing any
  # source; `fromEndpoints: [{}]` would instead allow every managed endpoint.
  ingress:
    - {}
  egress:
    # Permit cluster DNS without opening any other cluster service.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Candidate code receives only the public services needed to check out the
    # repository, resolve pinned Actions, install npm packages, and transfer
    # GitHub artifacts. Private networks and arbitrary Internet egress remain
    # denied. Extend this list only from failed-flow evidence.
    - toFQDNs:
        - matchName: github.com
        - matchPattern: "*.github.com"
        - matchPattern: "*.githubassets.com"
        - matchPattern: "*.githubusercontent.com"
        - matchPattern: "*.actions.githubusercontent.com"
        - matchPattern: "*.blob.core.windows.net"
        - matchName: registry.npmjs.org
        - matchPattern: "*.npmjs.org"
        - matchPattern: "*.npmjs.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
