---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: actions-runner-metrics-ingress
  namespace: actions-runner-system
spec:
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - controller-manager
          - runner-scale-set-listener
  ingress:
    # Prometheus is the only workload that needs the unauthenticated endpoint.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Preserve kubelet health probes and node-local diagnostics.
    - fromEntities:
        - host
