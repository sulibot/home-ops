apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tandoor-pg
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: tandoor-pg-password
    creationPolicy: Owner
    template:
      data:
        username: tandoor
        password: '{{ .POSTGRES_PASSWORD }}'
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: tandoor
        property: POSTGRES_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tandoor
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: tandoor-secret
    creationPolicy: Owner
    template:
      data:
        SECRET_KEY: '{{ .SECRET_KEY }}'
        SOCIALACCOUNT_PROVIDERS: '{"openid_connect":{"OAUTH_PKCE_ENABLED":true,"APPS":[{"provider_id":"authentik","name":"Authentik","client_id":"{{ .TANDOOR_OIDC_CLIENT_ID }}","secret":"{{ .TANDOOR_OIDC_CLIENT_SECRET }}","settings":{"server_url":"https://auth.sulibot.com/application/o/tandoor/.well-known/openid-configuration"}}]}}'
  data:
    - secretKey: SECRET_KEY
      remoteRef:
        key: tandoor
        property: SECRET_KEY
    - secretKey: TANDOOR_OIDC_CLIENT_ID
      remoteRef:
        key: tandoor
        property: TANDOOR_OIDC_CLIENT_ID
    - secretKey: TANDOOR_OIDC_CLIENT_SECRET
      remoteRef:
        key: tandoor
        property: TANDOOR_OIDC_CLIENT_SECRET

