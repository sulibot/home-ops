apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helmrelease.yaml
  - ocirepository.yaml
  - externalsecret.yaml
configMapGenerator:
  - name: tandoor-auth
    files:
      - auth/home_settings.py
      - auth/home_auth.py
generatorOptions:
  disableNameSuffixHash: true
