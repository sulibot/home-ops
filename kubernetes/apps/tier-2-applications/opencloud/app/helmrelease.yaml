---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opencloud
spec:
  chartRef:
    kind: OCIRepository
    name: opencloud
  interval: 1h
  timeout: 10m
  maxHistory: 3
  install:
    remediation:
      retries: 5
    timeout: 10m
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 5
      strategy: rollback
    timeout: 10m
  values:
    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    controllers:
      opencloud:
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/opencloudeu/opencloud-rolling
              tag: 5.2.0@sha256:c840de29b7287da070ffc9d5eb52a1b291a046877402bf70f387ccf56c820aee
            command:
              - /bin/sh
              - -c
              - "opencloud init || true; opencloud server"
            env:
              TZ: America/Los_Angeles
              OC_URL: https://opencloud.sulibot.com
              OC_LOG_LEVEL: info
              OC_ADD_RUN_SERVICES: collaboration
              # OpenCloud 5.2.0 creates an empty Bleve mapping on a fresh
              # config volume. Search is non-critical for file sync/access.
              OC_EXCLUDE_RUN_SERVICES: search
              OC_INSECURE: "false"
              OC_OIDC_ISSUER: "https://auth.sulibot.com/application/o/opencloud/"
              OC_OIDC_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: opencloud-secret
                    key: OPENCLOUD_OIDC_CLIENT_ID
              OC_OIDC_SCOPE: "openid profile email storage"
              # Native clients discover their client IDs and scopes through
              # OpenCloud WebFinger. They must request the custom Authentik
              # scope that carries the stable username, groups, and roles.
              WEBFINGER_WEB_OIDC_CLIENT_SCOPES: "openid profile email storage"
              WEBFINGER_DESKTOP_OIDC_CLIENT_SCOPES: "openid profile email offline_access storage"
              WEBFINGER_ANDROID_OIDC_CLIENT_SCOPES: "openid profile email offline_access storage"
              WEBFINGER_IOS_OIDC_CLIENT_SCOPES: "openid profile email offline_access storage"
              PROXY_OIDC_REWRITE_WELLKNOWN: "true"
              PROXY_AUTOPROVISION_ACCOUNTS: "true"
              GRAPH_USERNAME_MATCH: "none"
              PROXY_USER_OIDC_CLAIM: "opencloud_username"
              PROXY_AUTOPROVISION_CLAIM_USERNAME: "opencloud_username"
              PROXY_AUTOPROVISION_CLAIM_GROUPS: "opencloudGroups"
              PROXY_ROLE_ASSIGNMENT_DRIVER: oidc
              PROXY_ROLE_ASSIGNMENT_OIDC_CLAIM: roles
              PROXY_USER_CS3_CLAIM: "username"
              STORAGE_USERS_DRIVER: posix
              STORAGE_USERS_ID_CACHE_STORE: nats-js-kv
              STORAGE_USERS_POSIX_ROOT: /srv/user-files
              STORAGE_USERS_POSIX_PERSONAL_SPACE_PATH_TEMPLATE: '{{ "{{.User.Username | lower}}" }}/Cloud'
              # Space IDs are immutable even when a Space is renamed. Keeping
              # the ID in the physical path makes an NFS export stable.
              STORAGE_USERS_POSIX_GENERAL_SPACE_PATH_TEMPLATE: 'projects/{{ "{{.SpaceId}}" }}'
              STORAGE_USERS_POSIX_WATCH_FS: "true"
              # Inotify is real-time only for processes using this same
              # node-staged PVC. Syncthing therefore reuses this exact claim
              # and is co-scheduled with OpenCloud. Independent CephFS/NFS
              # mounts are assimilated only by a subsequent startup scan.
              STORAGE_USERS_POSIX_WATCH_TYPE: inotifywait
              STORAGE_USERS_POSIX_WATCH_PATH: /srv/user-files
              OC_ENABLE_OCM: "false"
              PROXY_HTTP_ADDR: 0.0.0.0:9200
              PROXY_TLS: "false"
              PROXY_CSP_CONFIG_FILE_LOCATION: /etc/opencloud/csp.yaml
              COLLABORATION_APP_NAME: CollaboraOnline
              COLLABORATION_APP_PRODUCT: Collabora
              COLLABORATION_APP_ADDR: https://collabora.sulibot.com
              COLLABORATION_APP_INSECURE: "false"
              COLLABORATION_APP_PROOF_DISABLE: "true"
              COLLABORATION_HTTP_ADDR: 0.0.0.0:9300
              COLLABORATION_WOPI_SRC: https://wopiserver.sulibot.com
              WEB_OIDC_AUTHORITY: "https://auth.sulibot.com/application/o/opencloud/"
              WEB_OIDC_METADATA_URL: "https://auth.sulibot.com/application/o/opencloud/.well-known/openid-configuration"
              WEB_OIDC_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: opencloud-secret
                    key: OPENCLOUD_OIDC_CLIENT_ID
              WEB_OIDC_SCOPE: "openid profile email storage"
              IDM_CREATE_DEMO_USERS: "false"
              GRAPH_ASSIGN_DEFAULT_USER_ROLE: "false"
              OC_ADMIN_USER_ID:
                valueFrom:
                  secretKeyRef:
                    name: opencloud-secret
                    key: IDM_ADMIN_USERNAME
              IDM_ADMIN_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: opencloud-secret
                    key: IDM_ADMIN_PASSWORD
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            resources:
              requests:
                cpu: 50m
                memory: 256Mi

    service:
      app:
        ipFamilyPolicy: PreferDualStack
        ipFamilies:
          - IPv6
          - IPv4
        ports:
          http:
            port: &port 9200
          wopi:
            port: &wopiPort 9300

    route:
      app:
        hostnames:
          - "opencloud.sulibot.com"
        parentRefs:
          - name: gateway-tunnel
            namespace: network
          - name: gateway-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port
      wopi:
        hostnames:
          - "wopiserver.sulibot.com"
        parentRefs:
          - name: gateway-tunnel
            namespace: network
          - name: gateway-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *wopiPort

    configMaps:
      config:
        data:
          app-registry.yaml: |-
            app_registry:
              mimetypes:
                - mime_type: application/vnd.oasis.opendocument.text
                  extension: odt
                  name: Document
                  description: OpenDocument text document
                  icon: ""
                  default_app: Collabora
                  allow_creation: true
                - mime_type: application/vnd.oasis.opendocument.spreadsheet
                  extension: ods
                  name: Spreadsheet
                  description: OpenDocument spreadsheet document
                  icon: ""
                  default_app: Collabora
                  allow_creation: true
                - mime_type: application/vnd.oasis.opendocument.presentation
                  extension: odp
                  name: Presentation
                  description: OpenDocument presentation document
                  icon: ""
                  default_app: Collabora
                  allow_creation: true
                - mime_type: application/vnd.openxmlformats-officedocument.wordprocessingml.document
                  extension: docx
                  name: Microsoft Word
                  description: Microsoft Word document
                  icon: ""
                  default_app: Collabora
                  allow_creation: true
                - mime_type: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
                  extension: xlsx
                  name: Microsoft Excel
                  description: Microsoft Excel spreadsheet
                  icon: ""
                  default_app: Collabora
                  allow_creation: true
                - mime_type: application/vnd.openxmlformats-officedocument.presentationml.presentation
                  extension: pptx
                  name: Microsoft PowerPoint
                  description: Microsoft PowerPoint presentation
                  icon: ""
                  default_app: Collabora
                  allow_creation: true
                - mime_type: text/markdown
                  extension: md
                  name: Markdown file
                  description: Markdown file
                  icon: ""
                  default_app: ""
                  allow_creation: true
          csp.yaml: |-
            directives:
              child-src:
                - "'self'"
                - "https://collabora.sulibot.com"
              connect-src:
                - "'self'"
                - "blob:"
                - "https://raw.githubusercontent.com/opencloud-eu/awesome-apps/"
                - "https://update.opencloud.eu/"
                - "https://auth.sulibot.com"
                - "wss://auth.sulibot.com"
                - "https://collabora.sulibot.com"
                - "https://wopiserver.sulibot.com"
              default-src:
                - "'none'"
              font-src:
                - "'self'"
              frame-ancestors:
                - "'self'"
              frame-src:
                - "'self'"
                - "blob:"
                - "https://embed.diagrams.net/"
                - "https://auth.sulibot.com"
                - "https://collabora.sulibot.com"
              img-src:
                - "'self'"
                - "data:"
                - "blob:"
                - "https://raw.githubusercontent.com/opencloud-eu/awesome-apps/"
              manifest-src:
                - "'self'"
              media-src:
                - "'self'"
              object-src:
                - "'self'"
                - "blob:"
              script-src:
                - "'self'"
                - "'unsafe-inline'"
              style-src:
                - "'self'"
                - "'unsafe-inline'"

    persistence:
      data:
        existingClaim: "{{ .Release.Name }}-config"
        globalMounts:
          - path: /var/lib/opencloud
            subPath: data
          - path: /etc/opencloud
            subPath: config
      user-files:
        existingClaim: user-storage-opencloud
        globalMounts:
          - path: /srv/user-files
      config-file:
        type: configMap
        identifier: config
        globalMounts:
          - path: /etc/opencloud/app-registry.yaml
            subPath: app-registry.yaml
          - path: /etc/opencloud/csp.yaml
            subPath: csp.yaml
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
