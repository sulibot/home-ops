---
# Idempotent post-deploy bootstrap:
#   1. Completes the Jellyfin first-run setup wizard (creates the admin
#      account from jellyfin-bootstrap-admin) if it hasn't run yet.
#   2. Adds the community SSO-Auth plugin repository and installs it if
#      missing, restarting Jellyfin to load it.
#   3. Registers the "authentik" OIDC provider via the plugin's REST API
#      (SSO-Auth has no Helm-values equivalent - it's plugin-config-only).
# Safe to rerun: each step checks current state before acting.
apiVersion: batch/v1
kind: Job
metadata:
  name: jellyfin-sso-bootstrap
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 6
  activeDeadlineSeconds: 1800
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: alpine:3.22
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: jellyfin-bootstrap-admin
            - secretRef:
                name: jellyfin-oidc
          env:
            JELLYFIN_URL: http://jellyfin
            OIDC_ISSUER: https://auth.sulibot.com/application/o/jellyfin/
            OIDC_PROVIDER_NAME: authentik
            SSO_PLUGIN_GUID: 505ce9d1-d916-42fa-86ca-673ef241d7df
            SSO_PLUGIN_REPO: https://raw.githubusercontent.com/9p4/jellyfin-plugin-sso/manifest-release/manifest.json
          command:
            - /bin/sh
            - -ec
            - |
              apk add --no-cache curl jq >/dev/null

              UA_HDR='X-Emby-Authorization: MediaBrowser Client="sso-bootstrap", Device="flux-job", DeviceId="sso-bootstrap", Version="1.0.0"'

              echo "waiting for jellyfin..."
              until curl -fsS "$JELLYFIN_URL/health" >/dev/null 2>&1; do sleep 5; done

              wizard_done="$(curl -fsS "$JELLYFIN_URL/System/Info/Public" | jq -r '.StartupWizardCompleted')"
              if [ "$wizard_done" != "true" ]; then
                echo "completing startup wizard"
                curl -fsS -X POST "$JELLYFIN_URL/Startup/User" \
                  -H "Content-Type: application/json" -H "$UA_HDR" \
                  -d "{\"Name\":\"$ADMIN_USERNAME\",\"Password\":\"$ADMIN_PASSWORD\"}"
                curl -fsS -X POST "$JELLYFIN_URL/Startup/Complete" -H "$UA_HDR"
              fi

              echo "authenticating"
              auth_resp="$(curl -fsS -X POST "$JELLYFIN_URL/Users/AuthenticateByName" \
                -H "Content-Type: application/json" -H "$UA_HDR" \
                -d "{\"Username\":\"$ADMIN_USERNAME\",\"Pw\":\"$ADMIN_PASSWORD\"}")"
              session_token="$(echo "$auth_resp" | jq -r '.AccessToken')"
              TOK_HDR="X-Emby-Token: $session_token"

              api_key="$(curl -fsS "$JELLYFIN_URL/Auth/Keys" -H "$TOK_HDR" -H "$UA_HDR" \
                | jq -r '.Items[]? | select(.AppName=="sso-bootstrap") | .AccessToken' | head -1)"
              if [ -z "$api_key" ] || [ "$api_key" = "null" ]; then
                echo "creating persistent api key"
                curl -fsS -X POST "$JELLYFIN_URL/Auth/Keys?app=sso-bootstrap" -H "$TOK_HDR" -H "$UA_HDR"
                api_key="$(curl -fsS "$JELLYFIN_URL/Auth/Keys" -H "$TOK_HDR" -H "$UA_HDR" \
                  | jq -r '.Items[]? | select(.AppName=="sso-bootstrap") | .AccessToken' | head -1)"
              fi

              repos="$(curl -fsS "$JELLYFIN_URL/Repositories" -H "$TOK_HDR" -H "$UA_HDR")"
              has_repo="$(echo "$repos" | jq --arg url "$SSO_PLUGIN_REPO" '[.[] | select(.Url==$url)] | length')"
              if [ "$has_repo" = "0" ]; then
                echo "registering SSO-Auth plugin repository"
                new_repos="$(echo "$repos" | jq --arg url "$SSO_PLUGIN_REPO" '. + [{"Name":"SSO-Auth","Url":$url,"Enabled":true}]')"
                curl -fsS -X POST "$JELLYFIN_URL/Repositories" -H "$TOK_HDR" -H "$UA_HDR" \
                  -H "Content-Type: application/json" -d "$new_repos"
              fi

              plugins="$(curl -fsS "$JELLYFIN_URL/Plugins" -H "$TOK_HDR" -H "$UA_HDR")"
              has_plugin="$(echo "$plugins" | jq --arg id "$SSO_PLUGIN_GUID" '[.[] | select(.Id==$id)] | length')"
              needs_restart=false
              if [ "$has_plugin" = "0" ]; then
                echo "installing SSO-Auth plugin"
                sleep 5
                curl -fsS -X POST "$JELLYFIN_URL/Packages/Installed/SSO%20Authentication?repositoryUrl=$(printf '%s' "$SSO_PLUGIN_REPO" | jq -sRr '@uri')" \
                  -H "$TOK_HDR" -H "$UA_HDR"
                needs_restart=true
              fi

              if [ "$needs_restart" = "true" ]; then
                echo "restarting jellyfin to load plugin"
                curl -fsS -X POST "$JELLYFIN_URL/System/Restart" -H "$TOK_HDR" -H "$UA_HDR" || true
                sleep 15
                until curl -fsS "$JELLYFIN_URL/health" >/dev/null 2>&1; do sleep 5; done
                sleep 10
              fi

              echo "configuring OIDC provider"
              curl -fsS -X POST "$JELLYFIN_URL/sso/OID/Add/${OIDC_PROVIDER_NAME}?api_key=${api_key}" \
                -H "Content-Type: application/json" \
                -d "{\"OidEndpoint\":\"$OIDC_ISSUER\",\"OidClientId\":\"$CLIENT_ID\",\"OidSecret\":\"$CLIENT_SECRET\",\"Enabled\":true,\"EnableAllFolders\":true,\"EnableAuthorization\":false,\"DefaultUsernameClaim\":\"preferred_username\"}"

              echo "sso bootstrap complete"
