---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: nzbget
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nzbget
  updatePolicy:
    updateMode: "Auto"
    minReplicas: 1
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        controlledResources: ["cpu", "memory"]
        controlledValues: RequestsOnly
        minAllowed:
          cpu: 10m
          memory: 64Mi
        # Idle near 20 MiB; unpacking bursts use the 12Gi limit, not the request.
        maxAllowed:
          cpu: "4"
          memory: 1Gi
