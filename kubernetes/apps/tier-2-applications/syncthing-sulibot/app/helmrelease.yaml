---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: syncthing-sulibot
spec:
  chartRef:
    kind: OCIRepository
    name: syncthing-sulibot
  interval: 1h
  timeout: 10m
  maxHistory: 3
  install:
    remediation:
      retries: 5
    timeout: 10m
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 5
      strategy: rollback
    timeout: 10m
  values:
    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      # OpenCloud's inotify watcher only receives changes made through the
      # same node-staged CephFS volume. Reuse its PVC and keep both workloads
      # on one node so Syncthing changes are assimilated in real time.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: opencloud
              topologyKey: kubernetes.io/hostname

    controllers:
      syncthing:
        type: deployment
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/syncthing/syncthing
              tag: 2.1.2@sha256:4464f4161dd0251e20d46bb3aec83363db75d80cef1abdd5d5fd4054b04a004d
            env:
              HOME: /var/syncthing/config
              STHOMEDIR: /var/syncthing/config
              STGUIADDRESS: "[::]:8384"
              STNODEFAULTFOLDER: "true"
              TZ: America/Los_Angeles
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /rest/noauth/health
                    port: &guiPort 8384
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /rest/noauth/health
                    port: *guiPort
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 24
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 1Gi

    service:
      app:
        controller: syncthing
        ipFamilyPolicy: PreferDualStack
        ipFamilies:
          - IPv6
          - IPv4
        ports:
          http:
            port: *guiPort
      peer:
        controller: syncthing
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: fd00:101:250::131,10.101.250.131
        labels:
          advertise: loadbalancer
        ipFamilyPolicy: PreferDualStack
        ipFamilies:
          - IPv6
          - IPv4
        externalTrafficPolicy: Cluster
        ports:
          sync-tcp:
            port: 22000
            protocol: TCP
          sync-quic:
            port: 22000
            protocol: UDP
          discovery:
            port: 21027
            protocol: UDP

    route:
      app:
        hostnames:
          - syncthing-sulibot.sulibot.com
        parentRefs:
          - name: gateway-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *guiPort

    persistence:
      config:
        existingClaim: syncthing-sulibot-config
        globalMounts:
          - path: /var/syncthing/config
      files:
        existingClaim: user-storage-opencloud
        globalMounts:
          - path: /var/syncthing/Cloud
            subPath: sulibot/Cloud
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
