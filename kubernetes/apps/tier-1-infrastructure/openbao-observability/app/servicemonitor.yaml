---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/servicemonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: openbao
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: openbao-metrics
  namespaceSelector:
    matchNames:
      - observability
  endpoints:
    - port: https-metrics
      scheme: https
      path: /v1/sys/metrics
      params:
        format:
          - prometheus
      interval: 15s
      scrapeTimeout: 10s
      tlsConfig:
        serverName: openbao.sulibot.com
      relabelings:
        - sourceLabels:
            - __meta_kubernetes_endpoint_hostname
          targetLabel: instance
        - targetLabel: cluster
          replacement: sulibot-openbao
