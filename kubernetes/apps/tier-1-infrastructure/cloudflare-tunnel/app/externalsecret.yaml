---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-tunnel
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: cloudflare-tunnel-secret
    template:
      data:
        credentials.json: |-
          {{ toJson (dict "AccountTag" .CLOUDFLARE_ACCOUNT_TAG "TunnelID" .CLOUDFLARE_TUNNEL_ID "TunnelSecret" .CLOUDFLARE_TUNNEL_SECRET) }}
        config.yaml: |-
          tunnel: {{ .CLOUDFLARE_TUNNEL_ID }}
          credentials-file: /etc/cloudflared/credentials.json
          warp-routing:
            enabled: true
          ingress:
            # Identity endpoints must remain reachable during native OIDC
            # redirects. Do not put either hostname behind Authentik-backed
            # Cloudflare Access: Kanidm is the identity provider for both
            # Authentik and OpenBao, so doing so would create an auth loop.
            #
            # Kanidm currently uses its verified IPv4 anycast VIP because the
            # tenant-100 IPv6 BGP session is down. OpenBao uses its working
            # IPv6 leader-gated VIP. The VIPs retain cluster-aware failover;
            # cloudflared must not independently balance the member nodes.
            - hostname: idm.sulibot.com
              originRequest:
                http2Origin: true
                originServerName: idm.sulibot.com
              service: https://10.100.0.60:443
            - hostname: openbao.sulibot.com
              originRequest:
                http2Origin: true
                originServerName: openbao.sulibot.com
              service: https://[fd00:100:0:240::67]:443
            - hostname: "*.sulibot.com"
              originRequest:
                http2Origin: true
                noTLSVerify: true
                originServerName: sulibot.com
              service: https://cilium-gateway-gateway-tunnel.network.svc.cluster.local:443
            - service: http_status:404
  dataFrom:
    - extract:
        key: cloudflare
