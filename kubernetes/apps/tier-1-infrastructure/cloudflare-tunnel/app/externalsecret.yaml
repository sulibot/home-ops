---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-tunnel
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: cloudflare-tunnel-secret
    template:
      data:
        credentials.json: |-
          {{ toJson (dict "AccountTag" .CLOUDFLARE_ACCOUNT_TAG "TunnelID" .CLOUDFLARE_TUNNEL_ID "TunnelSecret" .CLOUDFLARE_TUNNEL_SECRET) }}
        config.yaml: |-
          tunnel: {{ .CLOUDFLARE_TUNNEL_ID }}
          credentials-file: /etc/cloudflared/credentials.json
          warp-routing:
            enabled: true
          ingress:
            # Kanidm must remain reachable during native OIDC redirects. Do
            # not put it behind Authentik-backed Cloudflare Access: Kanidm is
            # the identity provider for both Authentik and OpenBao, so doing
            # so would create an authentication loop.
            #
            # Kanidm currently uses its verified IPv4 anycast VIP because the
            # tenant-100 IPv6 BGP session is down. OpenBao remains private;
            # explicitly reject its hostname before the wildcard route.
            - hostname: idm.sulibot.com
              originRequest:
                http2Origin: true
                originServerName: idm.sulibot.com
              service: https://10.100.0.60:443
            - hostname: openbao.sulibot.com
              service: http_status:404
            - hostname: "*.sulibot.com"
              originRequest:
                http2Origin: true
                noTLSVerify: true
                originServerName: sulibot.com
              service: https://cilium-gateway-gateway-tunnel.network.svc.cluster.local:443
            - service: http_status:404
  dataFrom:
    - extract:
        key: cloudflare
