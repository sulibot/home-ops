---
# The descheduler chart's own ClusterRole (Helm-managed, not editable here
# without it being reverted on next reconcile) omits persistentvolumeclaims
# read access. evictLocalStoragePods: true requires it to classify whether a
# pod's volumes are PVC-backed vs. genuinely local/ephemeral - without this,
# the descheduler pod spams "persistentvolumeclaims is forbidden" every few
# seconds and can't make correct eviction decisions for PVC-backed pods.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/rbac.authorization.k8s.io/clusterrole.json
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: descheduler-pvc-read
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/rbac.authorization.k8s.io/clusterrolebinding.json
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: descheduler-pvc-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: descheduler-pvc-read
subjects:
  - kind: ServiceAccount
    name: descheduler
    namespace: kube-system
