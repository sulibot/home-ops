---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kubernetes-jobs-rules
  namespace: observability
spec:
  groups:
    - name: kubernetes.jobs
      interval: 1m
      rules:
        # Missing last-success metrics intentionally produce no superseded
        # record. Never-successful CronJobs and standalone Jobs still alert.
        - record: kube_job_superseded_by_success
          expr: |
            kube_job_status_start_time
            * on(namespace, job_name) group_left(owner_name)
              kube_job_owner{owner_kind="CronJob"}
            <= on(namespace, owner_name) group_left()
              label_replace(kube_cronjob_status_last_successful_time,
                "owner_name", "$1", "cronjob", "(.+)")
        - alert: KubeJobFailed
          expr: |
            (kube_job_failed{condition="true"} == 1)
            unless on(namespace, job_name) kube_job_superseded_by_success
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Job {{ $labels.namespace }}/{{ $labels.job_name }} failed"
            description: |
              Job {{ $labels.namespace }}/{{ $labels.job_name }} reached a terminal failure.
              No newer successful run of its owning CronJob has superseded this failure.
              Check the Job conditions and logs; retained failures resolve after a successful run.
