---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gatus-rules
spec:
  groups:
    - name: gatus.rules
      rules:
        - alert: GatusEndpointDown
          expr: |-
            gatus_results_endpoint_success{group=~"external|services|core|apps-external|apps-internal|infra-internal|observability|datastores|cluster-101|cluster-104|cluster-104-apps|network|pve|storage"} == 0
          for: 5m
          annotations:
            summary: >-
              The {{ $labels.name }} endpoint is down
          labels:
            severity: critical

        - alert: GatusEndpointWarning
          expr: |-
            gatus_results_endpoint_success{group=~"internal|connectivity|buddy|cluster-104-internal"} == 0
          for: 5m
          annotations:
            summary: >-
              The {{ $labels.name }} endpoint is degraded
          labels:
            severity: warning

        - alert: GatusMtlsNegativeControlFailed
          expr: |-
            gatus_results_endpoint_success{group="security-negative-control"} == 0
          for: 2m
          annotations:
            summary: >-
              The {{ $labels.name }} mTLS negative control did not observe the expected edge denial
            runbook_url: >-
              https://github.com/sulibot/home-ops/blob/main/docs/runbooks/cloudflare-application-mtls.md
          labels:
            severity: critical
