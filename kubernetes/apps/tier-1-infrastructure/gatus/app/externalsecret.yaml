---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gatus
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: gatus-secret
    template:
      data:
        BUDDY_DDNS_HOSTNAME: "{{ .BUDDY_DDNS_HOSTNAME }}"
        BUDDY_HEARTBEAT_TOKEN: "{{ .BUDDY_HEARTBEAT_TOKEN }}"
        BUDDY_PUSHOVER_TOKEN: "{{ .PUSHOVER_GATUS }}"
        BUDDY_PUSHOVER_USER_KEY: "{{ .PUSHOVER_USER_KEY }}"
        BUDDY_STATUS_HOSTNAME: "{{ .BUDDY_STATUS_HOSTNAME }}"
  dataFrom:
    - extract:
        key: gatus
    - extract:
        key: pushover
---
# Dedicated Cloudflare Application Security mTLS identity for synthetic probes.
# The certificate and private key live only in 1Password and this projected
# Kubernetes Secret; they must never be committed to Git.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gatus-mtls
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: gatus-mtls-secret
    template:
      data:
        tls.crt: "{{ .CLOUDFLARE_MTLS_CERTIFICATE }}"
        tls.key: "{{ .CLOUDFLARE_MTLS_PRIVATE_KEY }}"
        certificate-id: "{{ .CLOUDFLARE_MTLS_CERTIFICATE_ID }}"
        serial: "{{ .CLOUDFLARE_MTLS_SERIAL }}"
        expires-on: "{{ .CLOUDFLARE_MTLS_EXPIRES_ON }}"
        fingerprint-sha256: "{{ .CLOUDFLARE_MTLS_FINGERPRINT_SHA256 }}"
  dataFrom:
    - extract:
        key: gatus
