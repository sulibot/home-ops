---
apiVersion: v1
kind: ConfigMap
metadata:
  name: engineering-ci-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  engineering-ci.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "graphTooltip": 1,
      "id": null,
      "links": [
        {
          "icon": "external link",
          "targetBlank": true,
          "title": "GitHub Actions",
          "type": "link",
          "url": "https://github.com/orgs/sulibot/actions"
        }
      ],
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "description": "Assigned jobs minus running jobs. This is a sampled ARC backlog approximation, not GitHub's complete queue.",
          "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "unit": "short"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "id": 1,
          "options": {"legend": {"calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom"}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [
            {"expr": "clamp_min(max by (name) (gha_assigned_jobs{name=~\"$scale_set\"}) - max by (name) (gha_running_jobs{name=~\"$scale_set\"}), 0)", "legendFormat": "{{name}} backlog", "refId": "A"},
            {"expr": "max by (name) (gha_running_jobs{name=~\"$scale_set\"})", "legendFormat": "{{name}} running", "refId": "B"}
          ],
          "title": "Runner demand",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "description": "Controller-reported pending and running ephemeral runners compared with the configured maximum. Controller lifecycle metrics remain accurate after scale-to-zero.",
          "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "min": 0, "unit": "short"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "id": 2,
          "options": {"legend": {"calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom"}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [
            {"expr": "max by (repository) (gha_controller_pending_ephemeral_runners{repository=~\"$repository\"})", "legendFormat": "{{repository}} pending", "refId": "A"},
            {"expr": "max by (repository) (gha_controller_running_ephemeral_runners{repository=~\"$repository\"})", "legendFormat": "{{repository}} running", "refId": "B"},
            {"expr": "max by (repository) (gha_max_runners{repository=~\"$repository\"})", "legendFormat": "{{repository}} max", "refId": "C"}
          ],
          "title": "Runner capacity",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {"defaults": {"color": {"mode": "continuous-GrYlRd"}, "unit": "s"}, "overrides": []},
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 8},
          "id": 3,
          "options": {"legend": {"calcs": ["lastNotNull"], "displayMode": "table", "placement": "bottom"}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [
            {"expr": "histogram_quantile(0.95, sum by (le, repository) (rate(gha_job_startup_duration_seconds_bucket{repository=~\"$repository\"}[$__rate_interval])))", "legendFormat": "{{repository}} p95", "refId": "A"},
            {"expr": "histogram_quantile(0.50, sum by (le, repository) (rate(gha_job_startup_duration_seconds_bucket{repository=~\"$repository\"}[$__rate_interval])))", "legendFormat": "{{repository}} p50", "refId": "B"}
          ],
          "title": "Job startup latency",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {"defaults": {"color": {"mode": "continuous-GrYlRd"}, "unit": "s"}, "overrides": []},
          "gridPos": {"h": 8, "w": 8, "x": 8, "y": 8},
          "id": 4,
          "options": {"legend": {"calcs": ["lastNotNull"], "displayMode": "table", "placement": "bottom"}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [
            {"expr": "histogram_quantile(0.95, sum by (le, repository) (rate(gha_job_execution_duration_seconds_bucket{repository=~\"$repository\"}[$__rate_interval])))", "legendFormat": "{{repository}} p95", "refId": "A"},
            {"expr": "histogram_quantile(0.50, sum by (le, repository) (rate(gha_job_execution_duration_seconds_bucket{repository=~\"$repository\"}[$__rate_interval])))", "legendFormat": "{{repository}} p50", "refId": "B"}
          ],
          "title": "Job execution latency",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "description": "Completed jobs observed during the time range selected in Grafana.",
          "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "decimals": 0, "links": [{"targetBlank": true, "title": "Open repository Actions", "url": "https://github.com/sulibot/${__field.labels.repository}/actions"}], "unit": "short"}, "overrides": []},
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 8},
          "id": 5,
          "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"},
          "targets": [
            {"expr": "sum by (repository, job_result) (increase(gha_completed_jobs_total{repository=~\"$repository\"}[$__range]) + (min_over_time(gha_completed_jobs_total{repository=~\"$repository\"}[$__range]) unless gha_completed_jobs_total{repository=~\"$repository\"} offset $__range))", "instant": true, "legendFormat": "{{repository}} {{job_result}}", "refId": "A"}
          ],
          "title": "Completed jobs (selected range)",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "description": "Test failures are diagnostic signals, not paging alerts. Open the authoritative GitHub run for details.",
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "links": [{"targetBlank": true, "title": "Open repository Actions", "url": "https://github.com/sulibot/${__field.labels.repository}/actions"}], "max": 100, "min": 0, "noValue": "no completed jobs", "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 5}, {"color": "red", "value": 15}]}, "unit": "percent"}, "overrides": []},
          "gridPos": {"h": 6, "w": 8, "x": 0, "y": 16},
          "id": 6,
          "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"},
          "targets": [
            {"expr": "100 * (sum by (repository) (increase(gha_completed_jobs_total{repository=~\"$repository\",job_result=\"failed\"}[$__range]) + (min_over_time(gha_completed_jobs_total{repository=~\"$repository\",job_result=\"failed\"}[$__range]) unless gha_completed_jobs_total{repository=~\"$repository\",job_result=\"failed\"} offset $__range)) or on (repository) 0 * sum by (repository) (increase(gha_completed_jobs_total{repository=~\"$repository\"}[$__range]) + (min_over_time(gha_completed_jobs_total{repository=~\"$repository\"}[$__range]) unless gha_completed_jobs_total{repository=~\"$repository\"} offset $__range))) / sum by (repository) (increase(gha_completed_jobs_total{repository=~\"$repository\"}[$__range]) + (min_over_time(gha_completed_jobs_total{repository=~\"$repository\"}[$__range]) unless gha_completed_jobs_total{repository=~\"$repository\"} offset $__range))", "instant": true, "legendFormat": "{{repository}}", "refId": "A"}
          ],
          "title": "Job failure ratio",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "description": "Current controller-reported running ephemeral runners divided by configured maximum. This remains accurate with minRunners=0.",
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "max": 100, "min": 0, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 70}, {"color": "red", "value": 95}]}, "unit": "percent"}, "overrides": []},
          "gridPos": {"h": 6, "w": 8, "x": 8, "y": 16},
          "id": 7,
          "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"},
          "targets": [
            {"expr": "100 * max by (repository) (gha_controller_running_ephemeral_runners{repository=~\"$repository\"}) / clamp_min(max by (repository) (gha_max_runners{repository=~\"$repository\"}), 1)", "legendFormat": "{{repository}}", "refId": "A"}
          ],
          "title": "Runner allocation",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "description": "One means Prometheus is successfully scraping each ARC listener target.",
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "mappings": [{"options": {"0": {"color": "red", "text": "DOWN"}, "1": {"color": "green", "text": "UP"}}, "type": "value"}], "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}, "unit": "short"}, "overrides": []},
          "gridPos": {"h": 6, "w": 8, "x": 16, "y": 16},
          "id": 8,
          "options": {"colorMode": "background", "graphMode": "none", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"},
          "targets": [
            {"expr": "max by (pod) (up{namespace=\"actions-runner-system\",pod=~\".*-listener\"})", "legendFormat": "{{pod}}", "refId": "A"}
          ],
          "title": "ARC listener scrape health",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "description": "Controller view of ephemeral runner lifecycle state. Persistent failed runners require investigation and cleanup.",
          "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "min": 0, "unit": "short"}, "overrides": []},
          "gridPos": {"h": 6, "w": 24, "x": 0, "y": 22},
          "id": 9,
          "options": {"legend": {"calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom"}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [
            {"expr": "max by (repository) (gha_controller_pending_ephemeral_runners{repository=~\"$repository\"})", "legendFormat": "{{repository}} pending", "refId": "A"},
            {"expr": "max by (repository) (gha_controller_running_ephemeral_runners{repository=~\"$repository\"})", "legendFormat": "{{repository}} running", "refId": "B"},
            {"expr": "max by (repository) (gha_controller_failed_ephemeral_runners{repository=~\"$repository\"})", "legendFormat": "{{repository}} failed", "refId": "C"}
          ],
          "title": "ARC controller runner lifecycle",
          "type": "timeseries"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["engineering", "ci", "github-actions", "arc"],
      "templating": {
        "list": [
          {
            "allValue": ".*",
            "current": {"selected": true, "text": "All", "value": "$__all"},
            "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
            "includeAll": true,
            "label": "Runner scale set",
            "multi": true,
            "name": "scale_set",
            "query": "label_values(gha_max_runners, name)",
            "refresh": 1,
            "sort": 1,
            "type": "query"
          },
          {
            "allValue": ".*",
            "current": {"selected": true, "text": "All", "value": "$__all"},
            "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
            "includeAll": true,
            "label": "Repository",
            "multi": true,
            "name": "repository",
            "query": "label_values(gha_completed_jobs_total, repository)",
            "refresh": 1,
            "sort": 1,
            "type": "query"
          }
        ]
      },
      "time": {"from": "now-24h", "to": "now"},
      "timepicker": {"refresh_intervals": ["30s", "1m", "5m", "15m"]},
      "timezone": "browser",
      "title": "Engineering CI",
      "uid": "engineering-ci",
      "version": 1
    }
