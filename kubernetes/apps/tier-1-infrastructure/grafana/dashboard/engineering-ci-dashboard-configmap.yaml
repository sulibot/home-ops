---
apiVersion: v1
kind: ConfigMap
metadata:
  name: engineering-ci-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  engineering-ci.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "graphTooltip": 1,
      "id": null,
      "links": [
        {
          "icon": "external link",
          "targetBlank": true,
          "title": "GitHub Actions",
          "type": "link",
          "url": "https://github.com/organizations/sulibot/settings/actions/runners"
        }
      ],
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "description": "Assigned jobs minus running jobs. This is a sampled ARC backlog approximation, not GitHub's complete queue.",
          "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "unit": "short"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "id": 1,
          "options": {"legend": {"calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom"}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [
            {"expr": "clamp_min(sum by (name) (gha_assigned_jobs{name=~\"$scale_set\"}) - sum by (name) (gha_running_jobs{name=~\"$scale_set\"}), 0)", "legendFormat": "{{name}} backlog", "refId": "A"},
            {"expr": "sum by (name) (gha_running_jobs{name=~\"$scale_set\"})", "legendFormat": "{{name}} running", "refId": "B"}
          ],
          "title": "Runner demand",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "description": "Registered and busy ephemeral runners compared with the configured maximum.",
          "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "min": 0, "unit": "short"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "id": 2,
          "options": {"legend": {"calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom"}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [
            {"expr": "sum by (name) (gha_registered_runners{name=~\"$scale_set\"})", "legendFormat": "{{name}} registered", "refId": "A"},
            {"expr": "sum by (name) (gha_busy_runners{name=~\"$scale_set\"})", "legendFormat": "{{name}} busy", "refId": "B"},
            {"expr": "sum by (name) (gha_max_runners{name=~\"$scale_set\"})", "legendFormat": "{{name}} max", "refId": "C"}
          ],
          "title": "Runner capacity",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {"defaults": {"color": {"mode": "continuous-GrYlRd"}, "unit": "s"}, "overrides": []},
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 8},
          "id": 3,
          "options": {"legend": {"calcs": ["lastNotNull"], "displayMode": "table", "placement": "bottom"}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [
            {"expr": "histogram_quantile(0.95, sum by (le, repository) (rate(gha_job_startup_duration_seconds_bucket{repository=~\"$repository\"}[$__rate_interval])))", "legendFormat": "{{repository}} p95", "refId": "A"},
            {"expr": "histogram_quantile(0.50, sum by (le, repository) (rate(gha_job_startup_duration_seconds_bucket{repository=~\"$repository\"}[$__rate_interval])))", "legendFormat": "{{repository}} p50", "refId": "B"}
          ],
          "title": "Job startup latency",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {"defaults": {"color": {"mode": "continuous-GrYlRd"}, "unit": "s"}, "overrides": []},
          "gridPos": {"h": 8, "w": 8, "x": 8, "y": 8},
          "id": 4,
          "options": {"legend": {"calcs": ["lastNotNull"], "displayMode": "table", "placement": "bottom"}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [
            {"expr": "histogram_quantile(0.95, sum by (le, repository) (rate(gha_job_execution_duration_seconds_bucket{repository=~\"$repository\"}[$__rate_interval])))", "legendFormat": "{{repository}} p95", "refId": "A"},
            {"expr": "histogram_quantile(0.50, sum by (le, repository) (rate(gha_job_execution_duration_seconds_bucket{repository=~\"$repository\"}[$__rate_interval])))", "legendFormat": "{{repository}} p50", "refId": "B"}
          ],
          "title": "Job execution latency",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "unit": "short"}, "overrides": []},
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 8},
          "id": 5,
          "options": {"legend": {"calcs": ["lastNotNull"], "displayMode": "table", "placement": "bottom"}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [
            {"expr": "sum by (repository, job_result) (rate(gha_completed_jobs_total{repository=~\"$repository\"}[$__rate_interval])) * 3600", "legendFormat": "{{repository}} {{job_result}}", "refId": "A"}
          ],
          "title": "Completed jobs per hour",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "description": "Test failures are diagnostic signals, not paging alerts. Open the authoritative GitHub run for details.",
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "max": 100, "min": 0, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 5}, {"color": "red", "value": 15}]}, "unit": "percent"}, "overrides": []},
          "gridPos": {"h": 6, "w": 8, "x": 0, "y": 16},
          "id": 6,
          "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"},
          "targets": [
            {"expr": "100 * sum by (repository) (rate(gha_completed_jobs_total{repository=~\"$repository\",job_result!~\"success|succeeded\"}[$__rate_interval])) / clamp_min(sum by (repository) (rate(gha_completed_jobs_total{repository=~\"$repository\"}[$__rate_interval])), 0.000001)", "legendFormat": "{{repository}}", "refId": "A"}
          ],
          "title": "Job failure ratio",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "description": "Current busy runners divided by configured maximum; unlike busy/registered this remains meaningful with minRunners=0.",
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "max": 100, "min": 0, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 70}, {"color": "red", "value": 95}]}, "unit": "percent"}, "overrides": []},
          "gridPos": {"h": 6, "w": 8, "x": 8, "y": 16},
          "id": 7,
          "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"},
          "targets": [
            {"expr": "100 * sum by (name) (gha_busy_runners{name=~\"$scale_set\"}) / clamp_min(sum by (name) (gha_max_runners{name=~\"$scale_set\"}), 1)", "legendFormat": "{{name}}", "refId": "A"}
          ],
          "title": "Runner utilization",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "description": "One means Prometheus is successfully scraping each ARC listener target.",
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "mappings": [{"options": {"0": {"color": "red", "text": "DOWN"}, "1": {"color": "green", "text": "UP"}}, "type": "value"}], "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}, "unit": "short"}, "overrides": []},
          "gridPos": {"h": 6, "w": 8, "x": 16, "y": 16},
          "id": 8,
          "options": {"colorMode": "background", "graphMode": "none", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"},
          "targets": [
            {"expr": "max by (pod) (up{namespace=\"actions-runner-system\",pod=~\".*-listener\"})", "legendFormat": "{{pod}}", "refId": "A"}
          ],
          "title": "ARC listener scrape health",
          "type": "stat"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["engineering", "ci", "github-actions", "arc"],
      "templating": {
        "list": [
          {
            "allValue": ".*",
            "current": {"selected": true, "text": "All", "value": "$__all"},
            "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
            "includeAll": true,
            "label": "Runner scale set",
            "multi": true,
            "name": "scale_set",
            "query": "label_values(gha_max_runners, name)",
            "refresh": 1,
            "sort": 1,
            "type": "query"
          },
          {
            "allValue": ".*",
            "current": {"selected": true, "text": "All", "value": "$__all"},
            "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
            "includeAll": true,
            "label": "Repository",
            "multi": true,
            "name": "repository",
            "query": "label_values(gha_completed_jobs_total, repository)",
            "refresh": 1,
            "sort": 1,
            "type": "query"
          }
        ]
      },
      "time": {"from": "now-24h", "to": "now"},
      "timepicker": {"refresh_intervals": ["30s", "1m", "5m", "15m"]},
      "timezone": "browser",
      "title": "Engineering CI",
      "uid": "engineering-ci",
      "version": 1
    }
