---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: user-storage-opencloud
  namespace: default
  labels:
    app.kubernetes.io/name: user-storage
    app.kubernetes.io/component: opencloud-files
spec:
  accessModes:
    - ReadWriteMany
  volumeMode: Filesystem
  resources:
    requests:
      storage: 1Ti
  storageClassName: ""
  volumeName: user-storage-opencloud
