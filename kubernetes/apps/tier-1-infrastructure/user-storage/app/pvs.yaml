---
# The CephFS directories are provisioned out-of-band before these PVs bind.
# Each static PV uses a path-scoped CephX identity. Pods never receive these
# keys directly; the Ceph CSI node plugin consumes them during node staging.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: user-storage-opencloud
  labels:
    app.kubernetes.io/name: user-storage
    app.kubernetes.io/component: opencloud-files
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  volumeMode: Filesystem
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  csi:
    driver: cephfs.csi.ceph.com
    volumeHandle: user-storage-opencloud
    nodeStageSecretRef:
      name: csi-ceph-opencloud-user-storage-secret
      namespace: ceph-csi
    volumeAttributes:
      clusterID: 407036f5-1f73-44ff-ba81-1f219b7a8a64
      fsName: content
      rootPath: /users
      staticVolume: "true"
      provisionVolume: "false"
      monitors: >-
        [fc00:20::1]:6789,[fc00:20::2]:6789,[fc00:20::3]:6789
