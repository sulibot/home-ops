---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# CronJob that auto-cleans pods stuck in ContainerStatusUnknown after a
# node reboot (Kubernetes' own PodGC doesn't reliably catch these once a
# replacement pod already exists). Not critical - a missed run just means
# stale-but-harmless pod objects linger until the next one.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pod-reaper
  namespace: flux-system
  labels:
    layer: "core"
    component: core-service
    critical: "false"
spec:
  dependsOn:
    - name: cilium
      namespace: flux-system
  interval: 15m
  retryInterval: 30s
  path: ./kubernetes/apps/tier-1-infrastructure/pod-reaper
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
