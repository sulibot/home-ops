---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-reaper
  namespace: kube-system
---
# Cluster-scoped: kubelet-lost pod debris (see pod-reaper.sh) can appear in
# any namespace after a node reboot/loss, not just kube-system.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pod-reaper
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pod-reaper
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pod-reaper
subjects:
  - kind: ServiceAccount
    name: pod-reaper
    namespace: kube-system
