---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/batch/v1/cronjob.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: volsync-backup-verifier
  namespace: volsync-system
spec:
  schedule: "0 6 * * *"  # Daily at 6 AM
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      # Verification failures are deterministic for a repository snapshot.
      # Do not repeat the expensive integrity scan in the same scheduled run.
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400  # Keep for 24 hours
      template:
        metadata:
          labels:
            app: volsync-backup-verifier
        spec:
          restartPolicy: Never
          serviceAccountName: volsync-backup-verifier
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: verifier
              image: ghcr.io/home-operations/kopia:0.22.3@sha256:17ab64542280197a5368247deaefadc3e3bbe15714ab666c2455a06824e86efd
              imagePullPolicy: IfNotPresent
              env:
                - name: KOPIA_REPOSITORY
                  valueFrom:
                    secretKeyRef:
                      name: volsync-maintenance-secret
                      key: KOPIA_REPOSITORY
                - name: KOPIA_S3_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: volsync-maintenance-secret
                      key: KOPIA_S3_ENDPOINT
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: volsync-maintenance-secret
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: volsync-maintenance-secret
                      key: AWS_SECRET_ACCESS_KEY
                - name: AWS_S3_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: volsync-maintenance-secret
                      key: AWS_S3_ENDPOINT
                - name: AWS_REGION
                  valueFrom:
                    secretKeyRef:
                      name: volsync-maintenance-secret
                      key: AWS_REGION
                - name: KOPIA_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: volsync-maintenance-secret
                      key: KOPIA_PASSWORD
                - name: KOPIA_CHECK_FOR_UPDATES
                  value: "false"
                - name: KOPIA_CONFIG_PATH
                  value: /tmp/kopia-verify.config
                - name: KOPIA_CACHE_DIRECTORY
                  value: /tmp/kopia-cache
                - name: KOPIA_LOG_DIR
                  value: /tmp/logs
                - name: HOME
                  value: "/tmp"
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail

                  echo "🔍 Volsync Backup Verification Report"
                  echo "======================================"
                  echo "Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
                  echo ""

                  # Connect to repository
                  echo "📦 Connecting to Kopia repository..."
                  if [[ "$KOPIA_REPOSITORY" =~ ^s3://([^/]+)(/(.*))?$ ]]; then
                    KOPIA_BUCKET="${BASH_REMATCH[1]}"
                    KOPIA_PREFIX="${BASH_REMATCH[3]}"
                  else
                    echo "❌ Unsupported KOPIA_REPOSITORY format: $KOPIA_REPOSITORY"
                    exit 1
                  fi

                  # kopia's --endpoint wants a bare host[:port], not a full URL
                  # (KOPIA_S3_ENDPOINT is shared with other volsync components
                  # that expect the full https:// form - strip it here only)
                  KOPIA_S3_HOST="${KOPIA_S3_ENDPOINT#https://}"
                  KOPIA_S3_HOST="${KOPIA_S3_HOST#http://}"
                  if [ -n "${KOPIA_PREFIX:-}" ] && [[ "${KOPIA_PREFIX}" != */ ]]; then
                    KOPIA_PREFIX="${KOPIA_PREFIX}/"
                  fi

                  CONNECT_ARGS=(
                    "--bucket=$KOPIA_BUCKET"
                    "--endpoint=$KOPIA_S3_HOST"
                    "--region=$AWS_REGION"
                    "--access-key=$AWS_ACCESS_KEY_ID"
                    "--secret-access-key=$AWS_SECRET_ACCESS_KEY"
                    "--password=$KOPIA_PASSWORD"
                    "--config-file=/tmp/kopia-verify.config"
                    "--override-hostname=volsync.volsync-system.svc.cluster.local"
                    "--override-username=volsync"
                    "--readonly"
                  )
                  if [ -n "${KOPIA_PREFIX:-}" ]; then
                    CONNECT_ARGS+=("--prefix=$KOPIA_PREFIX")
                  fi

                  kopia repository connect s3 \
                    "${CONNECT_ARGS[@]}"

                  echo "✅ Connected to repository"
                  echo ""

                  echo "📊 Repository Status:"
                  kopia repository status --config-file=/tmp/kopia-verify.config | grep -E "(Storage capacity|Storage available|Format version|Hash|Encryption)"
                  echo ""

                  echo "📥 Reading repository and live ReplicationSource state..."
                  kopia snapshot list --all --json \
                    --config-file=/tmp/kopia-verify.config > /tmp/snapshots.json
                  TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
                  curl --fail --silent --show-error \
                    --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
                    --header "Authorization: Bearer $TOKEN" \
                    https://kubernetes.default.svc/apis/volsync.backube/v1alpha1/replicationsources \
                    > /tmp/sources.json

                  echo "📸 Snapshot Statistics:"
                  TOTAL_SNAPSHOTS=$(jq 'length' /tmp/snapshots.json)
                  EXPECTED_SOURCES=$(jq '.items | length' /tmp/sources.json)
                  TODAY=$(date -u +%Y-%m-%d)
                  SNAPSHOTS_TODAY=$(jq --arg today "$TODAY" \
                    '[.[] | select(.startTime | startswith($today))] | length' \
                    /tmp/snapshots.json)
                  echo "   Total snapshots: $TOTAL_SNAPSHOTS"
                  echo "   Snapshots today: $SNAPSHOTS_TODAY"
                  echo "   Expected live sources: $EXPECTED_SOURCES"
                  echo ""

                  echo "🔬 Verifying each live source's latest snapshot..."
                  VERIFICATION_ERRORS=0
                  VERIFIED_SOURCES=0
                  SNAPSHOT_IDS=()
                  while IFS=$'\t' read -r namespace name; do
                    source="${name}@${namespace}:/data"
                    latest=$(jq -c \
                      --arg namespace "$namespace" \
                      --arg name "$name" \
                      '[.[] | select(.source.host == $namespace and .source.userName == $name)] | sort_by(.startTime) | last // empty' \
                      /tmp/snapshots.json)

                    if [ -z "$latest" ]; then
                      echo "   ❌ Missing repository snapshot for $source"
                      VERIFICATION_ERRORS=$((VERIFICATION_ERRORS + 1))
                      continue
                    fi

                    snapshot_id=$(jq -r '.id' <<<"$latest")
                    start_time=$(jq -r '.startTime' <<<"$latest")
                    total_size=$(jq -r '.stats.totalSize // 0' <<<"$latest")
                    source_errors=$(jq -r '(.stats.errorCount // 0) + (.stats.ignoredErrorCount // 0)' <<<"$latest")
                    age_seconds=$(jq -nr --arg timestamp "$start_time" \
                      'now - ($timestamp | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601)')

                    echo "   - $source id=$snapshot_id age=$(printf '%.0f' "$age_seconds")s size=${total_size}B"
                    if (( $(printf '%.0f' "$age_seconds") > 90000 )); then
                      echo "     ❌ Latest snapshot is older than 25 hours"
                      VERIFICATION_ERRORS=$((VERIFICATION_ERRORS + 1))
                    fi
                    if [ "$total_size" -le 0 ]; then
                      echo "     ❌ Latest snapshot is empty"
                      VERIFICATION_ERRORS=$((VERIFICATION_ERRORS + 1))
                    fi
                    if [ "$source_errors" -gt 0 ]; then
                      echo "     ❌ Snapshot recorded $source_errors source errors"
                      VERIFICATION_ERRORS=$((VERIFICATION_ERRORS + 1))
                    fi
                    SNAPSHOT_IDS+=("$snapshot_id")
                  done < <(
                    jq -r '.items[] | [.metadata.namespace, .metadata.name] | @tsv' \
                      /tmp/sources.json | sort
                  )

                  echo ""
                  echo "🧪 Running one repository-wide integrity pass over ${#SNAPSHOT_IDS[@]} latest snapshots..."
                  if [ "${#SNAPSHOT_IDS[@]}" -gt 0 ] && kopia snapshot verify \
                    --config-file=/tmp/kopia-verify.config \
                    --verify-files-percent=1 \
                    "${SNAPSHOT_IDS[@]}"; then
                    VERIFIED_SOURCES=${#SNAPSHOT_IDS[@]}
                    echo "✅ Integrity sample passed for all selected snapshots"
                  else
                    echo "❌ Repository integrity verification failed"
                    VERIFICATION_ERRORS=$((VERIFICATION_ERRORS + 1))
                  fi

                  echo ""
                  echo "================================"
                  echo "Verification Summary:"
                  echo "  Total snapshots: $TOTAL_SNAPSHOTS"
                  echo "  Expected live sources: $EXPECTED_SOURCES"
                  echo "  Verified live sources: $VERIFIED_SOURCES"
                  echo "  Verification errors: $VERIFICATION_ERRORS"

                  if [ "$EXPECTED_SOURCES" -eq 0 ] || [ "$VERIFIED_SOURCES" -ne "$EXPECTED_SOURCES" ] || [ "$VERIFICATION_ERRORS" -gt 0 ]; then
                    echo ""
                    echo "❌ VERIFICATION FAILED - backup coverage, freshness, or integrity is incomplete"
                    exit 1
                  fi

                  echo ""
                  echo "✅ Every live VolSync source has a fresh, non-empty, verified snapshot"
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 512Mi
          volumes:
            - name: tmp
              emptyDir: {}
---
# ServiceAccount with read-only access to repository
apiVersion: v1
kind: ServiceAccount
metadata:
  name: volsync-backup-verifier
  namespace: volsync-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: volsync-backup-verifier
rules:
  - apiGroups:
      - volsync.backube
    resources:
      - replicationsources
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: volsync-backup-verifier
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: volsync-backup-verifier
subjects:
  - kind: ServiceAccount
    name: volsync-backup-verifier
    namespace: volsync-system
