---
# A second static binding of the content CephFS. The unique volumeHandle avoids
# colliding with the default namespace PV while rootPath points at the same
# filesystem. The archive pod mounts this claim read-only.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: csi-cephfs-content-pv-volsync-offsite
spec:
  capacity:
    storage: 40Ti
  accessModes:
    - ReadWriteMany
  volumeMode: Filesystem
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: volsync-system
    name: offsite-content-source
  csi:
    driver: cephfs.csi.ceph.com
    volumeHandle: csi-cephfs-content-pv-volsync-offsite
    nodeStageSecretRef:
      name: csi-ceph-admin-secret
      namespace: ceph-csi
    volumeAttributes:
      clusterID: 407036f5-1f73-44ff-ba81-1f219b7a8a64
      fsName: content
      rootPath: /
      staticVolume: "true"
      provisionVolume: "false"
      monitors: >-
        [fc00:20::1]:6789,[fc00:20::2]:6789,[fc00:20::3]:6789
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: offsite-content-source
  namespace: volsync-system
spec:
  accessModes:
    - ReadWriteMany
  volumeMode: Filesystem
  resources:
    requests:
      storage: 40Ti
  storageClassName: ""
  volumeName: csi-cephfs-content-pv-volsync-offsite
