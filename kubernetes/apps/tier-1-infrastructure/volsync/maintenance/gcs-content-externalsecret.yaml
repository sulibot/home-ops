---
# GCS credentials are deliberately independent of B2 so the cold archive can
# be activated and restored while the hot offsite provider is still pending.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gcs-content-archive
  namespace: volsync-system
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: gcs-content-archive
  data:
    - secretKey: GCS_CONTENT_BUCKET
      remoteRef:
        key: offsite-backup-s3
        property: gcs-content-bucket
    - secretKey: GCS_SERVICE_ACCOUNT_JSON
      remoteRef:
        key: offsite-backup-s3
        property: gcs-service-account-json
    - secretKey: CONTENT_CRYPT_PASSWORD
      remoteRef:
        key: offsite-backup-s3
        property: content-crypt-password
    - secretKey: CONTENT_CRYPT_SALT
      remoteRef:
        key: offsite-backup-s3
        property: content-crypt-salt
