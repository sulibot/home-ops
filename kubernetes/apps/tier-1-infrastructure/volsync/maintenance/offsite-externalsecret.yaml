---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: volsync-offsite-s3
  namespace: volsync-system
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: volsync-offsite-s3
  data:
    - secretKey: B2_S3_ENDPOINT
      remoteRef:
        key: offsite-backup-s3
        property: s3-endpoint
    - secretKey: B2_REGION
      remoteRef:
        key: offsite-backup-s3
        property: region
    - secretKey: B2_KOPIA_BUCKET
      remoteRef:
        key: offsite-backup-s3
        property: kopia-bucket
    - secretKey: B2_KOPIA_ACCESS_KEY_ID
      remoteRef:
        key: offsite-backup-s3
        property: kopia-access-key-id
    - secretKey: B2_KOPIA_APPLICATION_KEY
      remoteRef:
        key: offsite-backup-s3
        property: kopia-application-key
    - secretKey: MINIO_MIRROR_ENDPOINT
      remoteRef:
        key: offsite-backup-s3
        property: minio-mirror-endpoint
    - secretKey: MINIO_MIRROR_ACCESS_KEY_ID
      remoteRef:
        key: offsite-backup-s3
        property: minio-mirror-access-key-id
    - secretKey: MINIO_MIRROR_SECRET_ACCESS_KEY
      remoteRef:
        key: offsite-backup-s3
        property: minio-mirror-secret-access-key
    - secretKey: B2_CNPG_BUCKET
      remoteRef:
        key: offsite-backup-s3
        property: cnpg-bucket
    - secretKey: B2_CNPG_ACCESS_KEY_ID
      remoteRef:
        key: offsite-backup-s3
        property: cnpg-access-key-id
    - secretKey: B2_CNPG_APPLICATION_KEY
      remoteRef:
        key: offsite-backup-s3
        property: cnpg-application-key
    - secretKey: B2_INFRA_BUCKET
      remoteRef:
        key: offsite-backup-s3
        property: infrastructure-bucket
    - secretKey: B2_INFRA_ACCESS_KEY_ID
      remoteRef:
        key: offsite-backup-s3
        property: infrastructure-access-key-id
    - secretKey: B2_INFRA_APPLICATION_KEY
      remoteRef:
        key: offsite-backup-s3
        property: infrastructure-application-key
---
# The CNPG drill runs in an isolated namespace and receives only the B2
# credentials required to restore the mirrored database repository.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-offsite-restore-s3
  namespace: backup-restore-drill
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: cnpg-offsite-restore-s3
  data:
    - secretKey: B2_S3_ENDPOINT
      remoteRef:
        key: offsite-backup-s3
        property: s3-endpoint
    - secretKey: B2_REGION
      remoteRef:
        key: offsite-backup-s3
        property: region
    - secretKey: B2_CNPG_BUCKET
      remoteRef:
        key: offsite-backup-s3
        property: cnpg-bucket
    - secretKey: B2_CNPG_ACCESS_KEY_ID
      remoteRef:
        key: offsite-backup-s3
        property: cnpg-access-key-id
    - secretKey: B2_CNPG_APPLICATION_KEY
      remoteRef:
        key: offsite-backup-s3
        property: cnpg-application-key
