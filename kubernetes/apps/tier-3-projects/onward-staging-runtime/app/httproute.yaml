---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: onward-staging
  namespace: engineering-staging
spec:
  hostnames:
    - onward-staging.sulibot.com
  parentRefs:
    - name: gateway-tunnel
      namespace: network
    - name: gateway-internal
      namespace: network
  rules:
    - backendRefs:
        - name: onward-staging
          port: 3000
