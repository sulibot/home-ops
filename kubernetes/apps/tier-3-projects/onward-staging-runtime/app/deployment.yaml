---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onward-staging
  namespace: engineering-staging
  labels:
    app.kubernetes.io/name: onward-staging
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: onward
    environment: staging
spec:
  replicas: 1
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 180
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: onward-staging
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: onward-staging
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: onward
        environment: staging
    spec:
      serviceAccountName: onward-staging
      automountServiceAccountToken: false
      enableServiceLinks: false
      # Resolve public FQDNs before Kubernetes search-suffix expansion so the
      # exact CoreDNS split-horizon rule is reached instead of wildcard DNS.
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      terminationGracePeriodSeconds: 30
      hostNetwork: false
      hostPID: false
      hostIPC: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: zot.sulibot.com/onward-staging@sha256:81f97a49561ca28e083acec39bffb98c5c5170aabdbb7087cb834383c8a588dd
          imagePullPolicy: IfNotPresent
          env:
            - name: NEXT_PUBLIC_ONWARD_APP_ORIGIN
              value: "https://onward-staging.sulibot.com"
            - name: ONWARD_AI_DRIVER
              value: disabled
            - name: ONWARD_AUTH_DRIVER
              value: provider
            - name: ONWARD_MAIL_DRIVER
              value: disabled
            - name: ONWARD_QUEUE_DRIVER
              value: disabled
            - name: ONWARD_RUNTIME_ENV
              value: staging
            - name: ONWARD_TRUST_PROXY_AUTH_ORIGIN
              value: cilium
          envFrom:
            - secretRef:
                name: onward-staging
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: private-artifacts
              mountPath: /var/lib/onward/private-artifacts
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: private-artifacts
          persistentVolumeClaim:
            claimName: onward-staging-private-artifacts
