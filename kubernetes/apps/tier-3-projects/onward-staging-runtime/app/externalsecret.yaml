---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: onward-staging
  namespace: engineering-staging
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: onward-staging
    creationPolicy: Owner
    template:
      data:
        ONWARD_AUTH_GOOGLE_CLIENT_ID: "{{ .ONWARD_AUTH_GOOGLE_CLIENT_ID }}"
        ONWARD_AUTH_GOOGLE_CLIENT_SECRET: "{{ .ONWARD_AUTH_GOOGLE_CLIENT_SECRET }}"
        ONWARD_AUTH_MICROSOFT_CLIENT_ID: "{{ .ONWARD_AUTH_MICROSOFT_CLIENT_ID }}"
        ONWARD_AUTH_MICROSOFT_CLIENT_SECRET: "{{ .ONWARD_AUTH_MICROSOFT_CLIENT_SECRET }}"
        ONWARD_AUTH_SESSION_PEPPER: "{{ .ONWARD_AUTH_SESSION_PEPPER }}"
        ONWARD_DATABASE_DIRECT_URL: "postgresql://onward_staging_app:{{ .ONWARD_DATABASE_APP_PASSWORD }}@context-fabric-supabase-db.engineering-staging.svc.cluster.local:5432/onward_staging"
        ONWARD_DATABASE_SESSION_POOL_URL: "postgresql://onward_staging_app:{{ .ONWARD_DATABASE_APP_PASSWORD }}@context-fabric-supabase-db.engineering-staging.svc.cluster.local:5432/onward_staging"
        ONWARD_STAGING_PRIVATE_ARTIFACT_ROOT: "/var/lib/onward/private-artifacts"
  dataFrom:
    - extract:
        key: onward-staging
  data:
    - secretKey: ONWARD_AUTH_GOOGLE_CLIENT_ID
      remoteRef:
        key: Onward Google OAuth
        property: username
    - secretKey: ONWARD_AUTH_GOOGLE_CLIENT_SECRET
      remoteRef:
        key: Onward Google OAuth
        property: credential
    - secretKey: ONWARD_AUTH_MICROSOFT_CLIENT_ID
      remoteRef:
        key: Onward Microsoft OAuth
        property: username
    - secretKey: ONWARD_AUTH_MICROSOFT_CLIENT_SECRET
      remoteRef:
        key: Onward Microsoft OAuth
        property: password
