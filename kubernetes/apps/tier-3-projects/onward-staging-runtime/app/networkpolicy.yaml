---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: onward-staging
  namespace: engineering-staging
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: onward-staging
      app.kubernetes.io/component: web
  ingress:
    # Kubelet probes originate from the node, not a namespace-scoped probe pod.
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # Only an explicitly labeled internal verifier may exercise the ClusterIP.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: engineering-staging
            app.kubernetes.io/name: onward-staging-verifier
            app.kubernetes.io/component: verifier
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # Gateway API backends see traffic from Cilium's reserved ingress identity.
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: engineering-staging
            k8s:app.kubernetes.io/instance: context-fabric
            k8s:app.kubernetes.io/name: supabase-db
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - toFQDNs:
        - matchName: accounts.google.com
        - matchName: oauth2.googleapis.com
        - matchName: www.googleapis.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
