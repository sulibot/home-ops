---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: onward-staging-runtime
  namespace: flux-system
  labels:
    layer: application
    environment: staging
    critical: "false"
spec:
  dependsOn:
    - name: engineering-staging
      namespace: flux-system
  interval: 15m
  retryInterval: 30s
  timeout: 5m
  path: ./kubernetes/apps/tier-3-projects/onward-staging-runtime/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: onward-staging
      namespace: engineering-staging
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# Rolls staging to each new Onward main build: see image-automation/.
# It does not depend on onward-staging-runtime, so a broken rollout can
# still be replaced by the next build.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: onward-staging-image-automation
  namespace: flux-system
  labels:
    layer: application
    environment: staging
    critical: "false"
spec:
  dependsOn:
    - name: engineering-staging
      namespace: flux-system
  interval: 15m
  retryInterval: 30s
  timeout: 5m
  path: ./kubernetes/apps/tier-3-projects/onward-staging-runtime/image-automation
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: flux-system
  wait: true
