---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/image.toolkit.fluxcd.io/imagerepository_v1.json
# zot needs no login to read. The Onward staging workflow pushes the tags.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: onward-staging
  labels:
    app.kubernetes.io/name: onward-staging
spec:
  image: zot.sulibot.com/onward-staging
  interval: 1m
  timeout: 1m
