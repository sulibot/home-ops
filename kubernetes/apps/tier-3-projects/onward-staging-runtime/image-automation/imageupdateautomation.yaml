---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/image.toolkit.fluxcd.io/imageupdateautomation_v1.json
# Commits the image that the onward-staging ImagePolicy picks into the
# staging Deployment on main. It changes only lines that carry the
# {"$imagepolicy": "flux-system:onward-staging"} marker, under update.path.
# To stop the rollouts: set suspend: true here (see the runbook).
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: onward-staging
spec:
  suspend: false
  # A policy change starts a run at once; the interval is only a fallback.
  interval: 30m
  policySelector:
    matchLabels:
      app.kubernetes.io/name: onward-staging
  sourceRef:
    kind: GitRepository
    name: home-ops-image-updates
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        name: flux-image-automation
        # Flux requires an address. This one is on the reserved .invalid
        # domain: it is not a mailbox.
        email: flux-image-automation@home-ops.invalid
      messageTemplate: |-
        chore(onward-staging): roll staging to the newest Onward main build

        {{ range .Changed.Changes -}}
        {{ .NewValue }}
        {{ end -}}
    push:
      branch: main
  update:
    path: ./kubernetes/apps/tier-3-projects/onward-staging-runtime/app
    strategy: Setters
