---
apiVersion: v1
kind: Namespace
metadata:
  name: engineering-staging
  labels:
    app.kubernetes.io/name: engineering-staging
    app.kubernetes.io/part-of: engineering-platform
    environment: staging
    # The community Supabase chart mirrors the upstream Docker images. Several
    # components do not yet satisfy Kubernetes' restricted profile, so enforce
    # baseline while retaining restricted audit/warnings for remediation work.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
