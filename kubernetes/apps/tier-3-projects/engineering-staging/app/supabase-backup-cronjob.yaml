---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: context-fabric-snapshot
  namespace: engineering-staging
  labels:
    app.kubernetes.io/name: context-fabric
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: context-fabric
spec:
  schedule: "30 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: context-fabric-snapshot
        spec:
          serviceAccountName: context-fabric-snapshot
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: snapshot
              image: alpine/k8s:1.34.1
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65532
              command:
                - /bin/sh
                - -ceu
                - |-
                  timestamp="$(date -u +%Y%m%d%H%M%S)"
                  create_snapshot() {
                    component="$1"
                    claim="$2"
                    snapshot="context-fabric-${component}-${timestamp}"
                    kubectl apply -f - <<YAML
                  apiVersion: snapshot.storage.k8s.io/v1
                  kind: VolumeSnapshot
                  metadata:
                    name: ${snapshot}
                    namespace: engineering-staging
                    labels:
                      app.kubernetes.io/name: context-fabric
                      app.kubernetes.io/component: backup
                      app.kubernetes.io/part-of: context-fabric
                      backup.sulibot.com/set: context-fabric
                      backup.sulibot.com/source: ${component}
                  spec:
                    volumeSnapshotClassName: csi-rbd-rbd-vm-snapclass
                    source:
                      persistentVolumeClaimName: ${claim}
                  YAML
                    kubectl -n engineering-staging wait \
                      --for=jsonpath='{.status.readyToUse}'=true \
                      "volumesnapshot/${snapshot}" --timeout=5m
                  }
                  create_snapshot db context-fabric-supabase-db
                  create_snapshot storage context-fabric-supabase-storage
                  kubectl -n engineering-staging get volumesnapshots -o json \
                    -l backup.sulibot.com/set=context-fabric |
                    jq -r '.items[] | select((.metadata.creationTimestamp | fromdateiso8601) < (now - 1209600)) | .metadata.name' |
                    while IFS= read -r snapshot; do
                      [ -n "${snapshot}" ] && kubectl -n engineering-staging delete volumesnapshot "${snapshot}"
                    done
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: context-fabric-snapshot
  namespace: engineering-staging
  labels:
    app.kubernetes.io/name: context-fabric
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: context-fabric
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: context-fabric-snapshot
  namespace: engineering-staging
  labels:
    app.kubernetes.io/name: context-fabric
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: context-fabric
rules:
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["create", "delete", "get", "list", "patch", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: context-fabric-snapshot
  namespace: engineering-staging
  labels:
    app.kubernetes.io/name: context-fabric
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: context-fabric
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: context-fabric-snapshot
subjects:
  - kind: ServiceAccount
    name: context-fabric-snapshot
    namespace: engineering-staging
