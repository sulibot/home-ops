---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: engineering-staging-backup-verifier
  namespace: engineering-staging
  labels:
    app.kubernetes.io/name: engineering-staging
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: engineering-platform
    cnpg.io/cluster: engineering-staging
spec:
  schedule: "15 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: engineering-staging-backup-verifier
        spec:
          serviceAccountName: engineering-staging-backup-verifier
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: verifier
              image: alpine/k8s:1.34.1
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65532
              env:
                - name: CLUSTER_NAME
                  value: engineering-staging
                - name: NAMESPACE
                  value: engineering-staging
                - name: MAX_AGE_SECONDS
                  value: "129600"
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  NOW="$(date -u +%s)"
                  to_epoch() {
                    jq -nr --arg timestamp "$1" \
                      '$timestamp | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601' \
                      2>/dev/null || echo 0
                  }
                  rows="$(
                    kubectl get backups.postgresql.cnpg.io -n "${NAMESPACE}" -o json |
                      jq -r --arg cluster "${CLUSTER_NAME}" '
                        .items[]
                        | select((.metadata.labels["cnpg.io/cluster"] // "") == $cluster)
                        | select((.spec.method // "") == "volumeSnapshot")
                        | select((.status.phase // "") == "completed")
                        | (.status.stoppedAt // .status.completedAt // .metadata.creationTimestamp // empty)
                      '
                  )"
                  newest=0
                  for stopped in ${rows}; do
                    timestamp="$(to_epoch "${stopped}")"
                    [ "${timestamp}" -gt "${newest}" ] && newest="${timestamp}"
                  done
                  [ "${newest}" -gt 0 ] || {
                    echo "ERROR: no completed VolumeSnapshot backup for ${CLUSTER_NAME}"
                    exit 1
                  }
                  age="$((NOW - newest))"
                  [ "${age}" -le "${MAX_AGE_SECONDS}" ] || {
                    echo "ERROR: newest backup is ${age}s old (limit ${MAX_AGE_SECONDS}s)"
                    exit 1
                  }
                  ready="$(
                    kubectl get volumesnapshots.snapshot.storage.k8s.io \
                      -n "${NAMESPACE}" \
                      -l "cnpg.io/cluster=${CLUSTER_NAME}" \
                      -o json |
                      jq '[.items[] | select(.status.readyToUse == true)] | length'
                  )"
                  [ "${ready}" -gt 0 ] || {
                    echo "ERROR: no ready VolumeSnapshot for ${CLUSTER_NAME}"
                    exit 1
                  }
                  echo "Backup verification passed for ${CLUSTER_NAME}; newest backup age ${age}s"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: engineering-staging-backup-verifier
  namespace: engineering-staging
  labels:
    app.kubernetes.io/name: engineering-staging
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: engineering-platform
    cnpg.io/cluster: engineering-staging
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: engineering-staging-backup-verifier
  namespace: engineering-staging
  labels:
    app.kubernetes.io/name: engineering-staging
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: engineering-platform
    cnpg.io/cluster: engineering-staging
rules:
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["backups"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: engineering-staging-backup-verifier
  namespace: engineering-staging
  labels:
    app.kubernetes.io/name: engineering-staging
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: engineering-platform
    cnpg.io/cluster: engineering-staging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: engineering-staging-backup-verifier
subjects:
  - kind: ServiceAccount
    name: engineering-staging-backup-verifier
    namespace: engineering-staging
