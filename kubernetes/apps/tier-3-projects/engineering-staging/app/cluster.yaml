---
# One small physical cluster amortized across non-production project databases.
# Household applications remain on postgres-vectorchord so staging migrations,
# load, upgrades, and recovery cannot affect Authentik or household services.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: engineering-staging
  namespace: engineering-staging
  labels:
    app.kubernetes.io/name: engineering-staging
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: engineering-platform
    environment: staging
spec:
  instances: 1
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:17-0.4.3
  monitoring:
    enablePodMonitor: false
  startDelay: 30
  stopDelay: 30
  switchoverDelay: 60
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      memory: 1Gi
  storage:
    size: 10Gi
    storageClass: csi-rbd-rbd-vm-sc-retain
  backup:
    volumeSnapshot:
      className: csi-rbd-rbd-vm-snapclass
      snapshotOwnerReference: backup
  bootstrap:
    initdb:
      # CNPG creates platform_owner and the engineering-staging-app Secret.
      # The role is intentionally outside managed.roles because it owns only
      # this empty bootstrap database and is not an application principal.
      database: platform
      owner: platform_owner
  managed:
    roles:
      - name: onward_owner
        ensure: present
        login: false
        inherit: false
        superuser: false
        createdb: false
        createrole: false
        replication: false
        bypassrls: false
      - name: onward_migrator
        ensure: present
        login: false
        inherit: false
        superuser: false
        createdb: false
        createrole: false
        replication: false
        bypassrls: false
        inRoles:
          - onward_owner
      - name: onward_api
        ensure: present
        login: false
        inherit: false
        superuser: false
        createdb: false
        createrole: false
        replication: false
        bypassrls: false
      - name: onward_worker
        ensure: present
        login: false
        inherit: false
        superuser: false
        createdb: false
        createrole: false
        replication: false
        bypassrls: false
      - name: onward_observer
        ensure: present
        login: false
        inherit: false
        superuser: false
        createdb: false
        createrole: false
        replication: false
        bypassrls: false
      - name: onward_audit_reader
        ensure: present
        login: false
        inherit: false
        superuser: false
        createdb: false
        createrole: false
        replication: false
        bypassrls: false
