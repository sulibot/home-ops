---
# Daily application-consistent local snapshot. A distinct off-cluster bucket and
# credential will be added before this environment receives durable user data.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: engineering-staging-snapshot
  namespace: engineering-staging
  labels:
    app.kubernetes.io/name: engineering-staging
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: engineering-platform
    cnpg.io/cluster: engineering-staging
spec:
  schedule: "0 30 2 * * *"
  immediate: true
  cluster:
    name: engineering-staging
  method: volumeSnapshot
  online: true
  onlineConfiguration:
    immediateCheckpoint: true
    waitForArchive: false
