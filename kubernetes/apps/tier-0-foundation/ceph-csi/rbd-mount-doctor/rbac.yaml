---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rbd-mount-doctor
  namespace: ceph-csi
---
# Cluster-scoped for the same reason as cephfs-mount-doctor's ClusterRole: an
# orphaned krbd mapping on a node can belong to a PVC in any namespace, and
# resolving it requires reading PVs/VolumeAttachments cluster-wide. This
# script only force-unmaps a device it has proven has no consumer on its node.
# It can also recycle a stale attachment and its still-Pending target pod, but
# only after a sustained Multi-Attach event proves demand on another node.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rbd-mount-doctor
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rbd-mount-doctor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rbd-mount-doctor
subjects:
  - kind: ServiceAccount
    name: rbd-mount-doctor
    namespace: ceph-csi
