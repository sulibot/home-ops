---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/batch/v1/cronjob.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cephfs-mount-doctor
  namespace: ceph-csi
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      backoffLimit: 0
      template:
        metadata:
          labels:
            app: cephfs-mount-doctor
        spec:
          restartPolicy: Never
          serviceAccountName: cephfs-mount-doctor
          containers:
            - name: mount-doctor
              image: alpine/k8s:1.34.1
              command: ["bash", "/scripts/mount-doctor.sh"]
              env:
                - name: AUTO_FIX
                  value: "true"
                # talosctl isn't in alpine/k8s, and ghcr.io/siderolabs/talosctl
                # is a scratch image with no shell to `cp` its binary out of -
                # rather than fighting that, the script uses `kubectl run` to
                # launch a short-lived pod FROM that image directly (native
                # entrypoint, no shell needed) only when a kubelet restart is
                # actually required, mounting this same secret into it.
                - name: TALOS_CREDENTIALS_SECRET
                  value: talos-operator-credentials
                - name: TALOSCTL_IMAGE
                  value: ghcr.io/siderolabs/talosctl:v1.12.4@sha256:d73e00cb8105c791277a810a2314dec7f3aae29b1ff6c9037a02fab7c97d4dfd
              volumeMounts:
                - name: script
                  mountPath: /scripts
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  # A full scan spawns a `kubectl exec` per node plus a
                  # cluster-wide pod list per broken mount found; 128Mi OOM'd
                  # silently on the node with the most mounts during testing,
                  # truncating the scan without any visible error.
                  memory: 384Mi
          volumes:
            - name: script
              configMap:
                name: cephfs-mount-doctor
                defaultMode: 0o555
