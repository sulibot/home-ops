---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cephfs-mount-doctor
  namespace: ceph-csi
---
# Cluster-scoped because a dead CephFS session on a node can affect a pod in
# any namespace; this only ever reads pods and deletes the specific ones
# found to have a session-less mount (see mount-doctor.sh for the exact
# detection logic - it never deletes based on anything else).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cephfs-mount-doctor
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  # For resolving the affected node's InternalIP to feed talosctl in the
  # broken-stale-stage-cache remediation below - without this the
  # `kubectl get node` lookup fails silently (stderr is suppressed) and
  # every remediation attempt reports the misleading
  # "no-ipv6-internal-ip-found", when the real cause is this missing
  # permission, not a missing address.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
  # For the broken-stale-stage-cache remediation only: create/watch a
  # short-lived pod running the talosctl image (with the os:operator-scoped
  # Talos credential - see talos-operator-credentials.sops.yaml) to restart
  # kubelet on the specific affected node. Cluster-scoped like the rest of
  # this ClusterRole (see comment on the ServiceAccount above) - the script
  # always targets the ceph-csi namespace by convention, not RBAC enforcement.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cephfs-mount-doctor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cephfs-mount-doctor
subjects:
  - kind: ServiceAccount
    name: cephfs-mount-doctor
    namespace: ceph-csi
