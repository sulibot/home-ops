---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/v1/configmap.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: cephfs-mount-doctor
  namespace: ceph-csi
data:
  mount-doctor.sh: |
    #!/usr/bin/env bash
    set -uo pipefail

    # Detects and (optionally) heals the failure mode from 2026-07-17: an MDS
    # daemon crash left some nodes' CephFS kernel-client sessions dead. The
    # kernel keeps the mount entry (visible in `mount`, looks fine to
    # kubelet's own liveness/readiness probes - those check the app's HTTP
    # port, never the filesystem) but every I/O against it returns EACCES.
    # Pods report Running/Ready while their storage is silently gone. Took
    # ~19h to notice manually; this runs every 10m instead.
    #
    # Detection: for every CephFS mount inside each csi-cephfsplugin
    # container, `ls` the mountpoint. A live session lists instantly; a dead
    # one returns permission-denied. AUTO_FIX=true additionally deletes the
    # owning pod (found by matching the kubelet pod-uid segment of the mount
    # path) so it reschedules with a fresh, working session - safe by
    # construction: a session confirmed dead server-side cannot be made
    # "more broken" by restarting the pod that depends on it.

    AUTO_FIX="${AUTO_FIX:-true}"
    remediated=0
    broken_total=0

    plugins=$(kubectl -n ceph-csi get pods -l app=ceph-csi-cephfs,component=nodeplugin -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.spec.nodeName}{"\n"}{end}')

    if [ -z "$plugins" ]; then
      echo "ERROR: no ceph-csi-cephfs nodeplugin pods found" >&2
      exit 1
    fi

    while read -r pod node; do
      [ -z "$pod" ] && continue
      # </dev/null is required: kubectl exec (even without -i) can still
      # consume the outer `while read` loop's stdin, silently truncating
      # the plugin list after the first iteration.
      broken=$(kubectl -n ceph-csi exec "$pod" -c csi-cephfsplugin -- sh -c '
        for m in $(mount | grep "type ceph" | awk "{print \$3}"); do
          ls "$m" >/dev/null 2>&1 || echo "$m"
        done
      ' 2>/dev/null </dev/null)

      if [ -z "$broken" ]; then
        echo "node=$node plugin=$pod status=healthy"
        continue
      fi

      uids=$(echo "$broken" | grep -oE '/var/lib/kubelet/pods/[a-f0-9-]+/' | sed -E 's#/var/lib/kubelet/pods/##; s#/##' | sort -u)
      for uid in $uids; do
        broken_total=$((broken_total + 1))
        target=$(kubectl get pods -A -o jsonpath='{range .items[?(@.metadata.uid=="'"$uid"'")]}{.metadata.namespace}{" "}{.metadata.name}{end}')
        if [ -z "$target" ]; then
          echo "node=$node plugin=$pod status=broken uid=$uid pod=<gone>"
          continue
        fi
        tns=$(echo "$target" | awk '{print $1}')
        tname=$(echo "$target" | awk '{print $2}')
        echo "node=$node plugin=$pod status=broken uid=$uid pod=$tns/$tname auto_fix=$AUTO_FIX"
        if [ "$AUTO_FIX" = "true" ]; then
          kubectl -n "$tns" delete pod "$tname" --wait=false \
            && { echo "REMEDIATED node=$node pod=$tns/$tname"; remediated=$((remediated + 1)); } \
            || echo "REMEDIATE_FAILED node=$node pod=$tns/$tname" >&2
        fi
      done

      # Broken *staging* mounts (.../csi/cephfs.csi.ceph.com/<volume-id>/globalmount)
      # with no matching pod-bind-mount above are orphaned: a CSI NodeStage
      # succeeded once, its session died, and no running pod currently
      # depends on that exact staging path. These block the *next* pod that
      # tries to use the volume (this is exactly what blocked sonarr on
      # 2026-07-17 - discovered and fixed manually before this existed).
      vol_ids=$(echo "$broken" | grep -oE '/csi/cephfs\.csi\.ceph\.com/[a-f0-9]+/globalmount' | grep -oE '[a-f0-9]{20,}')
      for vid in $vol_ids; do
        # Only touch it if genuinely unattached cluster-wide.
        if kubectl get volumeattachment -o jsonpath='{.items[*].metadata.name}' 2>/dev/null | grep -q "$vid"; then
          echo "node=$node plugin=$pod status=broken-staging vol=$vid attached=true (skipping - in use)"
          continue
        fi
        broken_total=$((broken_total + 1))
        echo "node=$node plugin=$pod status=broken-staging vol=$vid attached=false auto_fix=$AUTO_FIX"
        if [ "$AUTO_FIX" = "true" ]; then
          kubectl -n ceph-csi exec "$pod" -c csi-cephfsplugin -- sh -c \
            "umount -l /var/lib/kubelet/plugins/kubernetes.io/csi/cephfs.csi.ceph.com/$vid/globalmount && rm -rf /var/lib/kubelet/plugins/kubernetes.io/csi/cephfs.csi.ceph.com/$vid" \
            </dev/null \
            && { echo "REMEDIATED_STAGING node=$node vol=$vid"; remediated=$((remediated + 1)); } \
            || echo "REMEDIATE_STAGING_FAILED node=$node vol=$vid" >&2
        fi
      done
    done <<< "$plugins"

    # Second failure signature, found 2026-07-23: kubelet's own volume-manager
    # cache believes a shared (RWX) volume is already staged on a node and
    # only ever retries NodePublishVolume (the per-pod bind mount), never
    # NodeStageVolume (the per-node global mount) - even though the global
    # staging directory is genuinely gone. `ls` against the plugin's mounts
    # never sees this because there IS no mount to check; kubelet fails the
    # bind mount with "file does not exist" and retries forever. Deleting the
    # affected pod does NOT fix this - the cache is keyed per node+volume,
    # not per pod, and as long as any other pod on that node still holds the
    # volume, kubelet won't re-stage it. The only fix found is restarting
    # kubelet on the affected node (`talosctl service kubelet restart`),
    # which forces a full volume-manager resync.
    #
    # 2026-07-26: wired up for real. ghcr.io/siderolabs/talosctl is a
    # scratch image (no shell, can't `cp` its binary out for this container
    # to use directly), so instead this spawns a short-lived pod FROM that
    # image via `kubectl run` only when a restart is actually needed,
    # mounting an os:operator-scoped Talos client cert into it (see
    # talos-operator-credentials.sops.yaml). os:operator grants service
    # restart/reboot but explicitly NOT machine-config reads/writes or
    # secret access - restarting kubelet on a node is the only action this
    # automation can take, by design, even if the credential were somehow
    # exfiltrated.
    #
    # One line per distinct pod (a stuck pod emits a fresh FailedMount event
    # roughly every 2m, so dedup on namespace/name or broken_total balloons
    # every run instead of reporting the actual number of stuck pods). Nodes
    # are deduped separately (fixed_nodes) so a node with 5 stuck pods only
    # gets ONE kubelet restart per run, not five.
    stale_cache_pods=$(kubectl get events -A --field-selector reason=FailedMount -o json 2>/dev/null \
      | jq -r '.items[] | select(.message | contains("file does not exist"))
               | "\(.involvedObject.namespace) \(.involvedObject.name)"' \
      | sort -u)

    fixed_nodes=""
    if [ -n "$stale_cache_pods" ]; then
      while read -r pns pname; do
        [ -z "$pname" ] && continue
        # Events persist for up to ~1h after the underlying issue clears
        # (e.g. a kubelet restart fixed it manually) - re-check the pod's
        # actual current state rather than trusting event history alone,
        # or this reports false positives for an hour after every fix.
        pready=$(kubectl -n "$pns" get pod "$pname" -o jsonpath='{.status.containerStatuses[*].ready}' 2>/dev/null)
        if [ -n "$pready" ] && ! echo "$pready" | grep -q false; then
          echo "status=stale-event-only pod=$pns/$pname (all containers ready now, ignoring old FailedMount event)"
          continue
        fi
        pnode=$(kubectl -n "$pns" get pod "$pname" -o jsonpath='{.spec.nodeName}' 2>/dev/null)
        broken_total=$((broken_total + 1))
        echo "node=$pnode status=broken-stale-stage-cache pod=$pns/$pname auto_fix=$AUTO_FIX"

        if [ "$AUTO_FIX" != "true" ] || [ -z "$pnode" ]; then
          continue
        fi
        case " $fixed_nodes " in
          *" $pnode "*)
            echo "node=$pnode status=already-restarted-this-run pod=$pns/$pname (skipping, one restart per node per run)"
            remediated=$((remediated + 1))
            continue
            ;;
        esac
        node_ip=$(kubectl get node "$pnode" -o jsonpath='{.status.addresses[?(@.type=="InternalIP")].address}' 2>/dev/null \
          | tr ' ' '\n' | grep ':' | head -1)
        if [ -z "$node_ip" ]; then
          echo "REMEDIATE_FAILED node=$pnode pod=$pns/$pname reason=no-ipv6-internal-ip-found" >&2
          continue
        fi

        run_name="talosctl-kubelet-restart-$$"
        overrides="{\"apiVersion\":\"v1\",\"spec\":{\"restartPolicy\":\"Never\",\"containers\":[{\"name\":\"$run_name\",\"image\":\"$TALOSCTL_IMAGE\",\"args\":[\"-n\",\"$node_ip\",\"service\",\"kubelet\",\"restart\"],\"env\":[{\"name\":\"TALOSCONFIG\",\"value\":\"/talos/talosconfig\"}],\"volumeMounts\":[{\"name\":\"talos-credentials\",\"mountPath\":\"/talos\",\"readOnly\":true}]}],\"volumes\":[{\"name\":\"talos-credentials\",\"secret\":{\"secretName\":\"$TALOS_CREDENTIALS_SECRET\",\"defaultMode\":256}}]}}"
        kubectl -n ceph-csi run "$run_name" --image="$TALOSCTL_IMAGE" --restart=Never \
          --overrides="$overrides" >/dev/null 2>&1

        ok=false
        for _ in $(seq 1 30); do
          phase=$(kubectl -n ceph-csi get pod "$run_name" -o jsonpath='{.status.phase}' 2>/dev/null)
          [ "$phase" = "Succeeded" ] && { ok=true; break; }
          [ "$phase" = "Failed" ] && break
          sleep 2
        done
        kubectl -n ceph-csi logs "$run_name" 2>/dev/null | sed 's/^/  talosctl: /'
        kubectl -n ceph-csi delete pod "$run_name" --wait=false >/dev/null 2>&1

        if [ "$ok" = "true" ]; then
          echo "REMEDIATED node=$pnode pod=$pns/$pname action=kubelet-restart"
          fixed_nodes="$fixed_nodes $pnode"
          remediated=$((remediated + 1))
        else
          echo "REMEDIATE_FAILED node=$pnode pod=$pns/$pname action=kubelet-restart phase=$phase" >&2
        fi
      done <<< "$stale_cache_pods"
    fi

    echo "SUMMARY broken_mounts=$broken_total remediated=$remediated auto_fix=$AUTO_FIX"

    # Only fail the Job (feeds kube_job_status_failed -> alert) when a broken
    # mount was left unresolved - either auto-fix is off, or a delete failed.
    # A clean auto-heal (found + fixed) still exits 0, but the REMEDIATED
    # lines above are visible in Loki either way for audit.
    if [ "$broken_total" -gt 0 ] && [ "$remediated" -lt "$broken_total" ]; then
      exit 1
    fi
    exit 0
