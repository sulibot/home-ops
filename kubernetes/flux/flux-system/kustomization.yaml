apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- gotk-components.yaml
- gotk-sync.yaml
patches:
  # Bound kustomize-controller concurrency to protect the Ceph-backed Talos
  # system disk during full-revision reconciliation waves.
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: kustomize-controller
        namespace: flux-system
      spec:
        template:
          spec:
            containers:
            - name: manager
              args:
              - --events-addr=http://notification-controller.$(RUNTIME_NAMESPACE).svc.cluster.local./
              - --watch-all-namespaces=true
              - --log-level=info
              - --log-encoding=json
              - --enable-leader-election
              - --concurrent=1
              - --requeue-dependency=1m
    target:
      kind: Deployment
      name: kustomize-controller
  # Increase helm-controller concurrency for parallel HelmRelease deployments
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: helm-controller
        namespace: flux-system
      spec:
        template:
          spec:
            containers:
            - name: manager
              args:
              - --events-addr=http://notification-controller.$(RUNTIME_NAMESPACE).svc.cluster.local./
              - --watch-all-namespaces=true
              - --log-level=info
              - --log-encoding=json
              - --enable-leader-election
              - --concurrent=10
    target:
      kind: Deployment
      name: helm-controller
