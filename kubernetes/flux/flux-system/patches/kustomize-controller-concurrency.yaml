apiVersion: apps/v1
kind: Deployment
metadata:
  name: kustomize-controller
  namespace: flux-system
spec:
  template:
    spec:
      containers:
      - name: manager
        args:
        - --events-addr=http://notification-controller.$(RUNTIME_NAMESPACE).svc.cluster.local./
        - --watch-all-namespaces=true
        - --log-level=info
        - --log-encoding=json
        - --enable-leader-election
        # Keep reconciliation below the local XFS/Ceph-backed system-disk
        # saturation point. At ~135 Kustomizations, both 20 workers and a later
        # four-worker test created >1,000 blocked XFS workers during a full
        # revision wave on the Ceph-backed Talos system disk. Two workers are
        # required because parent health checks wait on child Kustomizations.
        - --concurrent=2
        - --requeue-dependency=1m
        - --feature-gates=ObjectLevelWorkloadIdentity=false
