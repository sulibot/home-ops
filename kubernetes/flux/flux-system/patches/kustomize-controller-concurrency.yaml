apiVersion: apps/v1
kind: Deployment
metadata:
  name: kustomize-controller
  namespace: flux-system
spec:
  template:
    spec:
      containers:
      - name: manager
        args:
        - --events-addr=http://notification-controller.$(RUNTIME_NAMESPACE).svc.cluster.local./
        - --watch-all-namespaces=true
        - --log-level=info
        - --log-encoding=json
        - --enable-leader-election
        # Keep reconciliation below the local XFS/Ceph-backed system-disk
        # saturation point. At ~135 Kustomizations, 20 workers plus 5-second
        # dependency retries created >1,000 blocked XFS workers on solwk02.
        - --concurrent=4
        - --requeue-dependency=30s
        - --feature-gates=ObjectLevelWorkloadIdentity=false
