---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/batch/cronjob_v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: matter-server-config-backup
  namespace: matter-server
  labels:
    app.kubernetes.io/name: matter-server-config-backup
    app.kubernetes.io/part-of: matter-server
spec:
  schedule: "47 3 * * *"
  timeZone: America/Los_Angeles
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: matter-server-config-backup
            app.kubernetes.io/part-of: matter-server
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: kopia
              image: ghcr.io/home-operations/kopia:0.22.3@sha256:17ab64542280197a5368247deaefadc3e3bbe15714ab666c2455a06824e86efd
              command: [/bin/bash, /scripts/backup.sh]
              envFrom:
                - secretRef:
                    name: matter-server-config-backup-secret
              env:
                - {name: KOPIA_CHECK_FOR_UPDATES, value: "false"}
                - {name: HOME, value: /tmp}
                - {name: KOPIA_CACHE_DIRECTORY, value: /tmp/kopia-cache}
                - {name: KOPIA_LOG_DIR, value: /tmp/kopia-logs}
                - {name: BACKUP_PATH, value: /data}
                - {name: KOPIA_HOSTNAME, value: cluster-104.matter-server}
                - {name: KOPIA_USERNAME, value: matter-server}
                - {name: BACKUP_DESCRIPTION, value: "cluster-104 Matter Server /data"}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: false
                capabilities: {drop: [ALL]}
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                limits: {memory: 512Mi}
              volumeMounts:
                - {name: data, mountPath: /data, readOnly: true}
                - {name: scripts, mountPath: /scripts, readOnly: true}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: matter-server-config
                readOnly: true
            - name: scripts
              configMap:
                name: cluster104-kopia-backup-script
                defaultMode: 0555
            - {name: tmp, emptyDir: {}}
