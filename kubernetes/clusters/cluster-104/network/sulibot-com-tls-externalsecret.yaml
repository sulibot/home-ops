---
# Mirror the certificate renewed on cluster-101 through its PushSecret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sulibot-com-tls
  namespace: network
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: sulibot-com-tls
    creationPolicy: Orphan
    template:
      type: kubernetes.io/tls
      data:
        tls.crt: "{{ .crt }}"
        tls.key: "{{ .key }}"
  dataFrom:
    - extract:
        key: sulibot-com-tls
        decodingStrategy: None
