---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ./namespace.yaml
  - ./flux-system
  - ../../apps/tier-0-foundation/external-secrets
  - ./multus
  - ./cilium-bgp
  - ./network
  - ./cloudflare-tunnel
  - ./external-dns
  - ./storage
  - ../../apps/tier-2-applications/home-assistant/app
  - ./home-assistant-backup
  - ./stateful-backups
  - ./kube-state-metrics
  - ./observer
  - ./log-forwarder
  - ./matter-server
  - ./music-assistant
  - ./otbr

# cluster-104 uses 1Password Connect. The shared OpenBao store is bound to
# cluster-101's API audience and must only be installed on that cluster.
patches:
  - target:
      group: kustomize.toolkit.fluxcd.io
      version: v1
      kind: Kustomization
      name: openbao-secret-store
      namespace: flux-system
    patch: |-
      $patch: delete
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: openbao-secret-store
        namespace: flux-system
