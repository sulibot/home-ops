name: Infra Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'site.yaml'
      - 'site.json'
      - 'INVENTORY.md'
      - 'terraform/infra/**'
      - 'nix/**'
      - 'scripts/sync-site-facts.sh'
      - 'scripts/validate-infra.sh'
      - '.github/workflows/infra-validate.yml'
  push:
    branches:
      - main
    paths:
      - 'site.yaml'
      - 'site.json'
      - 'INVENTORY.md'
      - 'terraform/infra/**'
      - 'nix/**'
  workflow_dispatch:

jobs:
  validate:
    name: Validate infra parameter layers
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup tools
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9
          tool_versions: |
            terraform 1.14.0
            terragrunt 0.93.8
            jq 1.7.1
            python 3.13.11

      - name: Setup Python yq
        run: |
          python3 -m pip install --user yq==3.4.3
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate
        run: ./scripts/validate-infra.sh
