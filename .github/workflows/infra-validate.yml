name: Infra Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'site.yaml'
      - 'site.json'
      - 'INVENTORY.md'
      - 'terraform/infra/**'
      - 'nix/**'
      - 'scripts/sync-site-facts.sh'
      - 'scripts/validate-infra.sh'
      - '.github/workflows/infra-validate.yml'
  push:
    branches:
      - main
    paths:
      - 'site.yaml'
      - 'site.json'
      - 'INVENTORY.md'
      - 'terraform/infra/**'
      - 'nix/**'
  workflow_dispatch:

jobs:
  validate:
    name: Validate infra parameter layers
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.7.13
          tool_versions: |
            terraform 1.14.0
            terragrunt 0.93.8
            jq 1.7.1
            python 3.13.11

      - name: Setup Python yq
        run: |
          python3 -m pip install --user yq==3.4.3
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate
        run: ./scripts/validate-infra.sh
