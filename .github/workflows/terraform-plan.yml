name: Terraform Plan

on:
  pull_request:
    branches:
      - main
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-plan.yml'

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  detect-changes:
    name: Detect Changed Clusters
    runs-on: ubuntu-latest
    outputs:
      clusters: ${{ steps.detect.outputs.clusters }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Detect changed cluster directories
        id: detect
        run: |
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)

          # Shared backend/module changes affect both cluster stacks.
          if echo "$CHANGED_FILES" | grep -Eq \
            '^terraform/infra/(root\.hcl|modules/|live/common/)'; then
            CLUSTERS='["cluster-101","cluster-104"]'
          else
            CLUSTERS=$(printf '%s\n' "$CHANGED_FILES" | \
              sed -nE 's|^terraform/infra/live/clusters/(cluster-[0-9]+)/.*|\1|p' | \
              sort -u | \
              jq -R -s -c 'split("\n") | map(select(length > 0))')
          fi

          echo "clusters=$CLUSTERS" >> $GITHUB_OUTPUT

          if [ "$CLUSTERS" = "[]" ] || [ -z "$CLUSTERS" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No cluster changes detected"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Detected changes in clusters: $CLUSTERS"
          fi

  terraform-plan:
    name: Plan ${{ matrix.cluster }}
    runs-on: home-ops-runner
    environment: terraform-plan
    env:
      # These orchestration units require generated Talos credentials and/or
      # machine configuration files that intentionally are not committed.
      # Plan the declarative infrastructure units in CI; exercise the excluded
      # units only from an authorized operator workspace during apply.
      TG_QUEUE_EXCLUDE_DIR: ./apply,./bootstrap,./cilium-bootstrap,./flux
      # The recovery-source check is an apply-time safety gate and requires a
      # local kubeconfig that is intentionally absent from ephemeral CI.
      CNPG_PREFLIGHT_SKIP: "true"
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.has_changes == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor_id == '6082800'
    timeout-minutes: 30
    strategy:
      matrix:
        cluster: ${{ fromJson(needs.detect-changes.outputs.clusters) }}
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/836187109693/locations/global/workloadIdentityPools/github-actions/providers/home-ops
          create_credentials_file: true

      - name: Authenticate to OpenBao
        env:
          OPENBAO_ADDR: https://openbao.sulibot.com
          OPENBAO_ROLE: terraform-plan
        run: |
          set -euo pipefail
          oidc_response="$(
            curl --silent --show-error --fail-with-body \
              --config <(
                printf 'header = "Authorization: Bearer %s"\n' \
                  "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
              ) \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fopenbao.sulibot.com"
          )"
          oidc_token="$(jq -er '.value' <<<"$oidc_response")"
          unset oidc_response

          login_payload="$(
            jq -cn --arg jwt "$oidc_token" --arg role "$OPENBAO_ROLE" \
              '{jwt:$jwt,role:$role}'
          )"
          unset oidc_token
          login_response="$(
            printf '%s' "$login_payload" |
              curl --silent --show-error --fail-with-body \
              --header 'content-type: application/json' \
              --request POST \
              --data-binary @- \
              "$OPENBAO_ADDR/v1/auth/jwt-github/login"
          )"
          unset login_payload
          openbao_token="$(jq -er '.auth.client_token' <<<"$login_response")"
          unset login_response

          echo "::add-mask::$openbao_token"
          echo "VAULT_ADDR=$OPENBAO_ADDR" >> "$GITHUB_ENV"
          echo "VAULT_TOKEN=$openbao_token" >> "$GITHUB_ENV"
          unset openbao_token

      - name: Setup tools
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.13
          tool_versions: |
            opentofu 1.12.5
            terragrunt 0.93.8
            sops 3.12.1
            jq 1.7.1

      - name: Restore artifact registry catalog
        working-directory: terraform/infra/live/artifacts/registry
        run: |
          set -euo pipefail
          catalog_path="../../clusters/_shared/artifacts-registry.json"

          terragrunt init -input=false
          terragrunt output -json |
            jq '{
              talos_image_file_ids: .talos_image_file_ids.value,
              talos_image_file_name: .talos_image_file_name.value,
              talos_image_id: .talos_image_id.value,
              talos_version: .talos_version.value,
              kubernetes_version: .kubernetes_version.value,
              generated_at: (now | todateiso8601)
            }' > "$catalog_path"

      - name: Initialize Terraform
        working-directory: terraform/infra/live/clusters/${{ matrix.cluster }}
        run: |
          echo "Initializing Terraform for ${{ matrix.cluster }}..."
          terragrunt run --all --non-interactive -- init -input=false

      - name: Validate Terraform
        working-directory: terraform/infra/live/clusters/${{ matrix.cluster }}
        run: |
          echo "Validating Terraform configuration..."
          terragrunt run --all --non-interactive -- validate

      - name: Generate Terraform Plan
        id: plan
        working-directory: terraform/infra/live/clusters/${{ matrix.cluster }}
        run: |
          echo "Generating Terraform plan..."
          if ! terragrunt run --all --non-interactive -- \
            plan -no-color > plan.txt 2>&1; then
            echo "::error::OpenTofu plan failed. Detailed output is withheld from this public repository's logs."
            echo "Error titles:"
            grep -E "Error:|ERROR " plan.txt | tail -20 || true
            exit 1
          fi

          if grep -Eq "Plan: .*([1-9][0-9]* to add|[1-9][0-9]* to change|[1-9][0-9]* to destroy)" plan.txt; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Comment PR with Plan
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const cluster = '${{ matrix.cluster }}';
            const hasChanges = '${{ steps.plan.outputs.has_changes }}' === 'true';

            const body = `## Terraform Plan: ${cluster}

            **Status**: ${hasChanges ? '⚠️ Changes detected' : '✅ No changes'}

            Detailed plan output is intentionally withheld from public logs,
            PR comments, and artifacts because it can contain infrastructure
            metadata. Reproduce the plan from an authorized operator workspace
            before applying.

            **Workflow Run**: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes(`Terraform Plan: ${cluster}`)
            );

            // Create or update comment
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      - name: Cleanup sensitive files
        if: always()
        run: |
          rm -f terraform/infra/live/clusters/${{ matrix.cluster }}/plan.txt

  summary:
    name: Plan Summary
    runs-on: ubuntu-latest
    needs: [detect-changes, terraform-plan]
    if: always() && needs.detect-changes.outputs.has_changes == 'true'
    steps:
      - name: Generate summary
        run: |
          echo "## Terraform Plan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.terraform-plan.result }}" = "success" ]; then
            echo "✅ All Terraform plans completed successfully" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.terraform-plan.result }}" = "failure" ]; then
            echo "❌ One or more Terraform plans failed" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Terraform plan status: ${{ needs.terraform-plan.result }}" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Clusters analyzed**: ${{ needs.detect-changes.outputs.clusters }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the individual job outputs and PR comments for detailed plans." >> $GITHUB_STEP_SUMMARY

  no-changes:
    name: No Terraform Changes
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'false'
    steps:
      - name: Report no changes
        run: |
          echo "## Terraform Plan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "ℹ️ No cluster configuration changes detected" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This PR does not modify shared infrastructure or files in \`terraform/infra/live/clusters/\`" >> $GITHUB_STEP_SUMMARY
