name: Cloudflare mTLS Expiry

on:
  schedule:
    - cron: "19 15 * * *"

permissions:
  contents: read
  id-token: write

jobs:
  audit:
    name: Audit Apple device identities
    runs-on: home-ops-runner
    environment: cloudflare-mtls-monitoring
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Authenticate to OpenBao
        env:
          OPENBAO_ADDR: https://openbao.sulibot.com
          OPENBAO_ROLE: cloudflare-mtls-monitor
        run: |
          set -euo pipefail
          oidc_response="$(
            curl --silent --show-error --fail-with-body \
              --config <(
                printf 'header = "Authorization: Bearer %s"\n' \
                  "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
              ) \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fopenbao.sulibot.com"
          )"
          oidc_token="$(jq -er '.value' <<<"$oidc_response")"
          unset oidc_response

          login_payload="$(
            jq -cn --arg jwt "$oidc_token" --arg role "$OPENBAO_ROLE" \
              '{jwt:$jwt,role:$role}'
          )"
          unset oidc_token
          login_response="$(
            printf '%s' "$login_payload" |
              curl --silent --show-error --fail-with-body \
                --header 'content-type: application/json' \
                --request POST \
                --data-binary @- \
                "$OPENBAO_ADDR/v1/auth/jwt-github/login"
          )"
          unset login_payload
          openbao_token="$(jq -er '.auth.client_token' <<<"$login_response")"
          unset login_response

          echo "::add-mask::$openbao_token"
          echo "VAULT_ADDR=$OPENBAO_ADDR" >> "$GITHUB_ENV"
          echo "VAULT_TOKEN=$openbao_token" >> "$GITHUB_ENV"
          unset openbao_token

      - name: Audit identity status and expiry
        run: scripts/cloudflare-mtls-device.sh audit --warning-days 30
