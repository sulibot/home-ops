# .sops.yaml
age_key: &age_key 'age1k3sunyva3kc3jusxs3j93nyueqjgzcgg6s6qghn8aeqpuy7l35wss8gxvg'
openbao_transit_key: &openbao_transit_key 'https://openbao.sulibot.com/v1/transit/keys/sops'

creation_rules:
  # Terraform
  # ... (existing rules) ...
  - path_regex: '^terraform/.*cluster-sulibot/(global|clusters)/.*\.sops\.ya?ml$'
    encrypted_regex: '^(data|stringData)$'
    age: *age_key
    hc_vault_transit_uri: *openbao_transit_key
  - path_regex: '^terraform/(infra/)?live/common/.*\.sops\.ya?ml$'
    # 2026-08-08: was a keyword allowlist (secret/token/password/endpoint) --
    # the same failure mode caught and fixed the same day in the
    # kabinett/registrar repo. It left openrouter_api_key and access_key
    # (neither name matches any of those keywords) sitting in plaintext in
    # this file, committed to git. A keyword allowlist is only as safe as
    # everyone remembering to name new fields so the regex catches them;
    # encrypting everything under this path removes that failure mode
    # instead of enumerating more keywords to dodge it.
    encrypted_regex: '.*'
    age: *age_key
    hc_vault_transit_uri: *openbao_transit_key
  - path_regex: '^terraform/live/golden/images/.*\.sops\.ya?ml$'
    encrypted_regex: '^(data|stringData|.*password|vm_password_hash)$'
    age: *age_key
    hc_vault_transit_uri: *openbao_transit_key
  - path_regex: '^terraform/.*\.sops\.ya?ml$'
    encrypted_regex: '^(data|stringData)$'
    age: *age_key
    hc_vault_transit_uri: *openbao_transit_key

  # Ansible
  - path_regex: '^ansible/k8s/secrets/sensitive\.enc\.yaml$'
    encrypted_regex: '^(bootstrap_token|ca_cert_hash)$'
    age: *age_key
    hc_vault_transit_uri: *openbao_transit_key
  - path_regex: '^ansible/k8s/secrets/.*\.sops\.yaml$'
    encrypted_regex: '^(.*_token|.*_secret|.*_key|password)$'
    age: *age_key
    hc_vault_transit_uri: *openbao_transit_key

  # Talos cluster secrets
  - path_regex: '^talos/clusters/.*/secrets\.sops\.yaml$'
    age: *age_key
    hc_vault_transit_uri: *openbao_transit_key

  # Kubernetes (general)
  - path_regex: '^kubernetes/sulibot-homeops/(global|clusters)/.*\.sops\.ya?ml$'
    encrypted_regex: '^(data|stringData)$'
    age: *age_key
    hc_vault_transit_uri: *openbao_transit_key
  - path_regex: '^kubernetes/.*/.*[-_]secret\.ya?ml$'
    encrypted_regex: '^(adminKey|userKey|api_key|MIKROTIK_PASSWORD|credentials\.json)$'
    age: *age_key
    hc_vault_transit_uri: *openbao_transit_key
  - path_regex: '^kubernetes/.*/values.*\.ya?ml$'
    encrypted_regex: '^(adminKey|userKey|secret|password)$'
    age: *age_key
    hc_vault_transit_uri: *openbao_transit_key
  - path_regex: '^kubernetes/.*/helmrelease\.ya?ml$'
    encrypted_regex: '^(adminKey|userKey|secret|password)$'
    age: *age_key
    hc_vault_transit_uri: *openbao_transit_key

  # Repository-wide fallback
  - path_regex: '.*\.sops\.ya?ml$'
    age: *age_key
    hc_vault_transit_uri: *openbao_transit_key
